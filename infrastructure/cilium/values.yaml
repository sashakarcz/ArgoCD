# Cilium Helm values for the Talos talos-default cluster.
#
# Migration from Flannel -- see tasks/cilium-migration.md. Bootstrapped via
# `helm install` (cilium-agent runs in the host netns, so it comes up before any
# CNI exists), then adopted into ArgoCD.
#
# Values follow the official Sidero "Cilium on Talos" guide:
#   https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium
#
# Pass 1 keeps kube-proxy (kubeProxyReplacement: false) to limit blast radius.
# Pass 2 (later) switches to Cilium kube-proxy replacement: set
# cluster.proxy.disabled: true in the Omni machine config and uncomment the
# kubeProxyReplacement / k8sServiceHost(KubePrism) block below.

# Reuse the CIDRs Talos already allocates per node (10.244.0.0/16) -- no
# renumbering, no conflict with the outgoing Flannel ranges.
ipam:
  mode: kubernetes

# --- MetalLB coexistence (CRITICAL) ---
# MetalLB owns LoadBalancer services (L2 mode, pool 192.168.7.206-250). Cilium
# ships with LB-IPAM enabled by default (enable-lb-ipam: true), which would arm
# a SECOND controller to hand out LoadBalancer IPs. Disable all of Cilium's
# service-LB features so MetalLB stays the sole owner -- no dueling announcers.
enableLBIPAM: false
loadBalancer:
  l2:
    enabled: false        # no Cilium L2 announcements (MetalLB does L2/ARP)
bgpControlPlane:
  enabled: false          # no Cilium BGP

kubeProxyReplacement: false
# Point the Cilium AGENT's apiserver connection at Talos KubePrism (the
# node-local apiserver LB on localhost:7445, which health-checks all control
# planes and fails over in ~1s). Without this the agent reaches the apiserver
# via the kubernetes ClusterIP -> kube-proxy -> a specific apiserver, so when
# that control-plane node reboots the endpoint lingers, the agent's watch
# breaks, it restarts (node.cilium.io/agent-not-ready taint), and the node
# flaps NotReady for ~1-2 min. This is independent of kubeProxyReplacement --
# it only changes the agent's own control connection, not the datapath, so it
# is safe to set while kube-proxy stays (the rest of Pass 2 / KPR is separate).
k8sServiceHost: localhost
k8sServicePort: 7445
# --- Pass 2 (KPR) -- uncomment together with cluster.proxy.disabled: true ---
# kubeProxyReplacement: true

# Talos-specific: Talos forbids workloads from loading kernel modules, so
# SYS_MODULE is DROPPED from Cilium's default agent capability set. Use this
# exact list (do not fall back to chart defaults, which include SYS_MODULE).
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# Talos mounts the cgroup2 fs at /sys/fs/cgroup; Cilium must not try to mount it.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

operator:
  replicas: 2

# Hubble: flow observability (a reason for moving off Flannel). UI is reachable
# via port-forward for now; expose via Traefik later if wanted.
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
    # Exposed via Traefik at https://hubble.starnix.net (cert-manager TLS,
    # ExternalDNS publishes the record from the ingress).
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - hubble.starnix.net
      tls:
        - hosts:
            - hubble.starnix.net
          secretName: hubble-ui-tls
