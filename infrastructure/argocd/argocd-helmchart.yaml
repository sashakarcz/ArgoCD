apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 7.7.20
    helm:
      releaseName: argocd
      values: |
        global:
          tolerations:
            - key: "node-role.kubernetes.io/control-plane"
              operator: "Exists"
              effect: "NoSchedule"

        controller:
          metrics:
            enabled: true
            service:
              enabled: true
              servicePort: 8082
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: monitoring

        server:
          metrics:
            enabled: true
            service:
              enabled: true
              servicePort: 8083
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: monitoring
          ingress:
            enabled: false  # We manage this separately via Traefik

        repoServer:
          metrics:
            enabled: true
            service:
              enabled: true
              servicePort: 8084
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: monitoring

          config:
            repositories: |
              - type: git
                url: https://github.com/usenix17/ArgoCD.git
              - type: helm
                name: vikunja
                url: ghcr.io/go-vikunja/helm-chart
                enableOCI: "true"

        configs:
          cm:
            url: https://argocd.starnix.net
            oidc.config: |
              name: Starnix
              issuer: https://auth.starnix.net/application/o/argocd/
              clientID: hMxnyA6KclvS6xyI7OUj1MewppIXYFAI8EV84xNY
              clientSecret: $oidc.authentik.clientSecret
              requestedScopes:
                - openid
                - profile
                - email
                # Carry group membership so RBAC can scope admin to a group
                # instead of granting every authenticated user admin. The
                # authentik argocd provider must emit a "groups" scope/claim
                # (add the "groups" scope mapping to the provider).
                - groups
          rbac:
            # Default to read-only: authenticating via authentik no longer
            # implies cluster-admin. Admin is granted only to members of the
            # "admins" group (defined in authentik-blueprints.yaml).
            policy.default: role:readonly
            policy.csv: |
              g, admins, role:admin
            scopes: "[groups]"
          params:
            server.insecure: true  # TLS termination handled by Traefik

        applicationSet:
          enabled: true

        notifications:
          enabled: true
          cm:
            service.webhook.apprise: |
              url: http://apprise.apprise.svc:8000/notify/argocd
              headers:
              - name: Content-Type
                value: application/json
            template.app-sync-succeeded: |
              webhook:
                apprise:
                  method: POST
                  body: |
                    {
                      "title": "{{.app.metadata.name}}",
                      "body": "✅ **{{.app.metadata.name}}** synced successfully.\nRevision: `{{.app.status.sync.revision | trunc 7}}`\nHealth: {{.app.status.health.status}}"
                    }
            template.app-sync-failed: |
              webhook:
                apprise:
                  method: POST
                  body: |
                    {
                      "title": "{{.app.metadata.name}}",
                      "body": "❌ **{{.app.metadata.name}}** sync failed.\n{{.app.status.operationState.message}}"
                    }
            template.app-health-degraded: |
              webhook:
                apprise:
                  method: POST
                  body: |
                    {
                      "title": "{{.app.metadata.name}}",
                      "body": "⚠️ **{{.app.metadata.name}}** health is **Degraded**."
                    }
            trigger.on-sync-succeeded: |
              - when: app.status.operationState.phase in ['Succeeded'] and app.metadata.name not in ['root', 'applications']
                send: [app-sync-succeeded]
            trigger.on-sync-failed: |
              - when: app.status.operationState.phase in ['Error', 'Failed']
                send: [app-sync-failed]
            trigger.on-health-degraded: |
              - when: app.status.health.status == 'Degraded'
                send: [app-health-degraded]
            defaultTriggers: |
              - on-sync-succeeded
              - on-sync-failed
              - on-health-degraded
            subscriptions: |
              - recipients:
                - apprise:
                triggers:
                - on-sync-succeeded
                - on-sync-failed
                - on-health-degraded
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
  - group: "*"
    kind: Secret
    name: argocd-initial-admin-secret
    jsonPointers:
    - /data
  - group: ""
    kind: ConfigMap
    name: argocd-notifications-cm
    jsonPointers:
    - /data
