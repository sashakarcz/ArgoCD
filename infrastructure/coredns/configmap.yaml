apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    # Internal zones — forwarded directly to KnotDNS, bypassing node resolver
    starnix.net:53 {
        # Pin vault.starnix.net to its Nebula-mesh IP so VSO reaches Vault privately
        # over the mesh (valid LE cert on :443), instead of hairpinning out through the
        # public Cloudflare tunnel. fallthrough = all other names still forward to Knot.
        hosts {
            100.69.0.45 vault.starnix.net
            fallthrough
        }
        # Primary: in-cluster KnotDNS LB. Fallbacks: the Unbound resolvers
        # (FreeBSD jail, 192.168.1.53 / 10.17.89.53) which forward starnix.net
        # to the same KnotDNS, so an intermittent primary timeout/SERVFAIL fails
        # over instead of breaking VSO (Vault static secrets) and other clients.
        # policy sequential = prefer 211.
        forward . 192.168.7.211 192.168.1.53 10.17.89.53 {
            policy sequential
        }
        cache 30
    }
    # In-cluster clients (e.g. krampus doing server-side OIDC discovery) reach
    # auth.starnix.net via the Traefik Service, not the MetalLB VIP: Traefik is
    # externalTrafficPolicy:Local, so a pod only reaches the VIP (192.168.7.207)
    # when co-scheduled with the single Traefik pod. rewrite resolves the Service
    # name dynamically through the kubernetes plugin, so there is no hardcoded
    # ClusterIP to rot if the Service is ever recreated. This more-specific zone
    # wins over starnix.net above; external clients still get the VIP from Knot.
    auth.starnix.net:53 {
        rewrite name exact auth.starnix.net traefik.traefik.svc.cluster.local
        kubernetes cluster.local {
            namespaces traefik
        }
        cache 30
    }
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        log . {
            class error
        }
        prometheus :9153

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
