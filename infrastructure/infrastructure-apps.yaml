apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 40.3.0
    helm:
      releaseName: traefik
      values: |
        service:
          annotations:
            metallb.universe.tf/loadBalancerIPs: "192.168.7.207"
          spec:
            type: LoadBalancer
            externalTrafficPolicy: Cluster

        ports:
          web:
            port: 80
            exposedPort: 80
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
          websecure:
            port: 443
            exposedPort: 443
            http3:
              enabled: false
          metrics:
            port: 9100
            expose:
              default: true

        ingressRoute:
          dashboard:
            enabled: false

        providers:
          kubernetesCRD:
            enabled: true
            allowCrossNamespace: true
          kubernetesIngress:
            enabled: true
            publishedService:
              enabled: true

        logs:
          general:
            level: INFO
          access:
            enabled: true

        metrics:
          prometheus:
            entryPoint: metrics
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

