apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 7.7.20
    helm:
      releaseName: argocd
      values: |
        global:
          tolerations:
            - key: "node-role.kubernetes.io/control-plane"
              operator: "Exists"
              effect: "NoSchedule"

        controller:
          metrics:
            enabled: true
            service:
              enabled: true
              servicePort: 8082
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: monitoring

        server:
          metrics:
            enabled: true
            service:
              enabled: true
              servicePort: 8083
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: monitoring
          ingress:
            enabled: false  # We manage this separately via Traefik

          config:
            repositories: |
              - type: git
                url: https://github.com/usenix17/ArgoCD.git

        configs:
          cm:
            url: https://argocd.starnix.net
            oidc.config: |
              name: Starnix
              issuer: https://auth.starnix.net/application/o/argocd/
              clientID: hMxnyA6KclvS6xyI7OUj1MewppIXYFAI8EV84xNY
              clientSecret: $oidc.authentik.clientSecret
              requestedScopes:
                - openid
                - profile
                - email
                # Carry group membership so RBAC can scope admin to a group.
                # The authentik argocd provider must emit a "groups" claim.
                - groups
            # Reloader triggers restarts by stamping this annotation on the pod
            # template. Ignore it globally so selfHeal doesn't revert it (which
            # would cause a double-restart / OutOfSync flapping).
            resource.customizations.ignoreDifferences.apps_Deployment: |
              jsonPointers:
                - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
            resource.customizations.ignoreDifferences.apps_StatefulSet: |
              jsonPointers:
                - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
            resource.customizations.ignoreDifferences.apps_DaemonSet: |
              jsonPointers:
                - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
          rbac:
            # Default to read-only: authenticating via authentik no longer
            # implies cluster-admin (it previously granted role:admin to every
            # SSO user). Admin is scoped to the "admins" group from authentik
            # (authentik-blueprints.yaml).
            policy.default: role:readonly
            policy.csv: |
              g, admins, role:admin
            scopes: "[groups]"
          params:
            # insecure=true is the documented pattern when TLS is terminated at
            # the edge (Traefik) and ArgoCD is reached over the in-cluster
            # network; do NOT flip without also moving Traefik to an HTTPS
            # backend, or you will lock yourself out of the UI/API.
            server.insecure: true

        repoServer:
          metrics:
            enabled: true
            service:
              enabled: true
              servicePort: 8084
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: monitoring

        applicationSet:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
  - group: "*"
    kind: Secret
    name: argocd-initial-admin-secret
    jsonPointers:
    - /data

