apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    # Phase-2 upgrade complete: chart 10.1.3 (Argo CD v3.4.5). Reached via
    # 7.7.20 -> 8.6.4 (v2->v3 boundary) -> 10.1.3. See tasks/argocd-v3-upgrade-plan.md
    targetRevision: 10.1.3
    helm:
      releaseName: argocd
      values: |
        global:
          # CVE-2026-15416 (CWE-306): the repo-server gRPC endpoint has no
          # authentication, so any pod that can reach :8081 can achieve RCE.
          # Enabling networkPolicy generates ingress restrictions that limit
          # repo-server and redis to their legitimate in-cluster peers, which
          # is the mitigation upstream ships on by default from chart 10.x.
          # Kept here so the fix survives independent of the chart version.
          networkPolicy:
            create: true
          tolerations:
            - key: "node-role.kubernetes.io/control-plane"
              operator: "Exists"
              effect: "NoSchedule"

        controller:
          metrics:
            enabled: true
            service:
              enabled: true
              servicePort: 8082
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: monitoring

        server:
          metrics:
            enabled: true
            service:
              enabled: true
              servicePort: 8083
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: monitoring
          ingress:
            enabled: false  # We manage this separately via Traefik
          # NOTE: server.config was removed from the chart at 6.0.0, so the old
          # server.config.repositories block here was a silent no-op. Repos are
          # actually served by standalone Secrets (repo-1527747537,
          # vikunja-helm-oci). Migrating them to configs.repositories is tracked
          # as post-v3-upgrade cleanup (tasks/argocd-v3-upgrade-plan.md sec 7).

        configs:
          # Declaratively manage the repos that were previously standalone
          # Secrets (git repo added via the API; vikunja OCI applied by hand).
          # Values mirror the live secrets exactly so this only formalizes
          # ownership -- no functional change to repo access.
          repositories:
            argocd-repo:
              url: https://github.com/usenix17/ArgoCD
              type: git
            vikunja-helm-oci:
              url: oci://ghcr.io/go-vikunja/helm-chart
              type: helm
              name: vikunja
              enableOCI: "true"
          cm:
            url: https://argocd.starnix.net
            # Resource tracking via annotation (the Argo CD v3 default). The
            # switch off the legacy label method was done deliberately, after
            # the version upgrade, so the one-time resource relabel happened in
            # isolation rather than compounding the upgrade churn.
            application.resourceTrackingMethod: annotation
            oidc.config: |
              name: Starnix
              issuer: https://auth.starnix.net/application/o/argocd/
              clientID: hMxnyA6KclvS6xyI7OUj1MewppIXYFAI8EV84xNY
              clientSecret: $oidc.authentik.clientSecret
              requestedScopes:
                - openid
                - profile
                - email
                # Carry group membership so RBAC can scope admin to a group.
                # The authentik argocd provider must emit a "groups" claim.
                - groups
            # Reloader triggers restarts by stamping this annotation on the pod
            # template. Ignore it globally so selfHeal doesn't revert it (which
            # would cause a double-restart / OutOfSync flapping).
            resource.customizations.ignoreDifferences.apps_Deployment: |
              jsonPointers:
                - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
            resource.customizations.ignoreDifferences.apps_StatefulSet: |
              jsonPointers:
                - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
            resource.customizations.ignoreDifferences.apps_DaemonSet: |
              jsonPointers:
                - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
          rbac:
            # Default to read-only: authenticating via authentik no longer
            # implies cluster-admin (it previously granted role:admin to every
            # SSO user). Admin is scoped to the "admins" group from authentik
            # (authentik-blueprints.yaml).
            policy.default: role:readonly
            policy.csv: |
              g, admins, role:admin
            scopes: "[groups]"
          params:
            # insecure=true is the documented pattern when TLS is terminated at
            # the edge (Traefik) and ArgoCD is reached over the in-cluster
            # network; do NOT flip without also moving Traefik to an HTTPS
            # backend, or you will lock yourself out of the UI/API.
            server.insecure: true

        repoServer:
          metrics:
            enabled: true
            service:
              enabled: true
              servicePort: 8084
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: monitoring

        dex:
          # SSO is direct Authentik OIDC (configs.cm.oidc.config), not routed
          # through Dex, so the dex-server is unused. Disable it.
          enabled: false

        applicationSet:
          enabled: true

        notifications:
          enabled: true
          cm:
            service.webhook.apprise: |
              url: http://apprise.apprise.svc:8000/notify/argocd
              headers:
              - name: Content-Type
                value: application/json
            template.app-sync-succeeded: |
              webhook:
                apprise:
                  method: POST
                  body: |
                    {
                      "title": "{{.app.metadata.name}}",
                      "body": "✅ **{{.app.metadata.name}}** synced successfully.\nRevision: `{{.app.status.sync.revision | trunc 7}}`\nHealth: {{.app.status.health.status}}"
                    }
            template.app-sync-failed: |
              webhook:
                apprise:
                  method: POST
                  body: |
                    {
                      "title": "{{.app.metadata.name}}",
                      "body": "❌ **{{.app.metadata.name}}** sync failed.\n{{.app.status.operationState.message}}"
                    }
            template.app-health-degraded: |
              webhook:
                apprise:
                  method: POST
                  body: |
                    {
                      "title": "{{.app.metadata.name}}",
                      "body": "⚠️ **{{.app.metadata.name}}** health is **Degraded**."
                    }
            trigger.on-sync-succeeded: |
              - when: app.status.operationState.phase in ['Succeeded'] and app.metadata.name not in ['root', 'applications']
                send: [app-sync-succeeded]
            trigger.on-sync-failed: |
              - when: app.status.operationState.phase in ['Error', 'Failed']
                send: [app-sync-failed]
            trigger.on-health-degraded: |
              - when: app.status.health.status == 'Degraded'
                send: [app-health-degraded]
            defaultTriggers: |
              - on-sync-succeeded
              - on-sync-failed
              - on-health-degraded
            subscriptions: |
              - recipients:
                - apprise:
                triggers:
                - on-sync-succeeded
                - on-sync-failed
                - on-health-degraded
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Apply server-side so the large v3.x Argo CD CRDs do not blow the 256KB
      # client-side last-applied-configuration annotation limit during the
      # upgrade (the applications CRD annotation is already ~144KB).
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
  - group: "*"
    kind: Secret
    name: argocd-initial-admin-secret
    jsonPointers:
    - /data
  # argocd-notifications-cm is rendered by this chart, but the notifications
  # controller annotates it at runtime; ignore /data so selfHeal doesn't flap.
  - group: ""
    kind: ConfigMap
    name: argocd-notifications-cm
    jsonPointers:
    - /data

