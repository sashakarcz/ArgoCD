apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://metallb.github.io/metallb
    chart: metallb
    targetRevision: 0.16.1
    helm:
      releaseName: metallb
      values: |
        # Pure L2 mode (no BGP). Chart 0.16 flips frrk8s.enabled to true by
        # default, which would deploy an unused frr-k8s DaemonSet + CRDs.
        # Keep the deployment lean by disabling it.
        frrk8s:
          enabled: false
        speaker:
          ignoreExcludeLB: true
          secretName: metallb-memberlist
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

