apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      # OpenBao (Vault-API-compatible), reached over the Nebula mesh via the
      # CoreDNS override (vault.starnix.net -> 100.69.0.45). kv-v2 mount 'secret'.
      server: https://vault.starnix.net
      path: secret
      version: v2
      auth:
        # Reuse VSO's existing OpenBao plumbing unchanged: the jwt auth method
        # at mount 'kubernetes', role 'cluster' (wildcard-bound to any SA/ns,
        # audience 'vault', policy cluster-secrets-reader -> read secret/data/
        # cluster/*). ESO mints a projected token for its own controller SA.
        jwt:
          path: kubernetes
          role: cluster
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: external-secrets
              namespace: external-secrets
            audiences:
              - vault
            expirationSeconds: 600
