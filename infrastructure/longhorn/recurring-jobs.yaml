apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
spec:
  cron: "0 2 * * *"
  task: backup
  groups:
    - default
  retain: 7
  concurrency: 2
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: hourly-snapshot
  namespace: longhorn-system
spec:
  cron: "0 */6 * * *"
  task: snapshot
  groups:
    - default
  # Trimmed 4 -> 2 (2026-07-06): long snapshot chains made replica rebuilds sync
  # many multi-GB snapshot files and fail mid-transfer. 12h of snapshots, backed
  # by 7 daily backups, keeps rebuilds cheap + reliable.
  retain: 2
  concurrency: 2
