apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.11.2
    helm:
      releaseName: longhorn
      values: |
        persistence:
          defaultClassReplicaCount: 3
          migratable: true
          recurringJobSelector:
            enable: true
            jobList: '[{"name":"daily-backup","isGroup":false},{"name":"hourly-snapshot","isGroup":false}]'
        defaultSettings:
          # Delete pods on downed nodes so StatefulSets reschedule instead of sitting Pending
          nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
          # Rebuild replicas faster after a node recovers (was 600s)
          replicaReplenishmentWaitInterval: 60
          # Match storage class replica count so UI-created volumes also get 3 replicas
          defaultReplicaCount: 3
          # Rebalance replicas gradually when nodes recover (was disabled)
          replicaAutoBalance: least-effort
          # Rebuild degraded replicas on detached volumes proactively
          offlineReplicaRebuilding: enabled
          # Allow enough time for large volume backups to complete (was 1 min)
          backupExecutionTimeout: 30
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
