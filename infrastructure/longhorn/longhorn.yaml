apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.11.3
    helm:
      releaseName: longhorn
      values: |
        persistence:
          # Retain so a PVC delete (e.g. an ArgoCD prune during a node flap, as
          # happened to jellyfin 2026-06-27) can never destroy the Longhorn
          # volume + data. Trade-off: intentional PVC deletes leave orphaned
          # Released PVs/volumes to clean up by hand (kubectl get pv | grep Released).
          reclaimPolicy: Retain
          defaultClassReplicaCount: 3
          migratable: true
          recurringJobSelector:
            enable: true
            jobList: '[{"name":"daily-backup","isGroup":false},{"name":"hourly-snapshot","isGroup":false}]'
        defaultSettings:
          # Delete pods on downed nodes so StatefulSets reschedule instead of sitting Pending
          nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
          # Wait for a rebooted node to return before rebuilding its replicas, so a node
          # reboot doesn't trigger a rebuild storm (was 60 -- caused a 2026-07-06 cascade)
          replicaReplenishmentWaitInterval: 600
          # Serialize rebuilds to avoid thrashing instance-managers (Longhorn default is 5;
          # 5-wide rebuilds during the 2026-07-06 reboot flapped replicas into a cascade)
          concurrentReplicaRebuildPerNodeLimit: 2
          # Match storage class replica count so UI-created volumes also get 3 replicas
          defaultReplicaCount: 3
          # Rebalance replicas gradually when nodes recover (was disabled)
          replicaAutoBalance: least-effort
          # Rebuild degraded replicas on detached volumes proactively
          offlineReplicaRebuilding: enabled
          # Allow enough time for large volume backups to complete (was 1 min)
          backupExecutionTimeout: 30
          # Tolerate I/O spikes during rebuilds before dropping a replica (was 8s).
          # An 8s r/w timeout killed the fleetdm mysql-pvc rebuild repeatedly on
          # 2026-07-16 while the volume served live DB writes.
          engineReplicaTimeout: 30
          # Give large snapshot file-syncs room to complete (was 30s). The same
          # 2026-07-16 rebuild EOF'd transferring a ~12.7GB snapshot within 30s.
          replicaFileSyncHttpClientTimeout: 120
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
