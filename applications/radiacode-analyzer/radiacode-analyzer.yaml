apiVersion: v1
kind: Namespace
metadata:
  name: radiacode-analyzer
  labels:
    app: radiacode-analyzer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radiacode-analyzer
  namespace: radiacode-analyzer
  labels:
    app: radiacode-analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radiacode-analyzer
  template:
    metadata:
      labels:
        app: radiacode-analyzer
    spec:
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: radiacode-analyzer
        image: astrognome/radiacode-analyzer:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: radiacode-analyzer-service
  namespace: radiacode-analyzer
  labels:
    app: radiacode-analyzer
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "RadiaCode Analyzer"
    gethomepage.dev/description: "Gamma Spectrum Analyzer"
    gethomepage.dev/group: "Apps"
    gethomepage.dev/icon: "mdi-radioactive"
    gethomepage.dev/href: "https://radiacode.starnix.net"
    gethomepage.dev/pod-selector: "app=radiacode-analyzer"
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: radiacode-analyzer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radiacode-analyzer-ingress
  namespace: radiacode-analyzer
  labels:
    app: radiacode-analyzer
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "RadiaCode Analyzer"
    gethomepage.dev/description: "Gamma Spectrum Analyzer"
    gethomepage.dev/group: "Apps"
    gethomepage.dev/icon: "mdi-radioactive"
    gethomepage.dev/href: "https://radiacode.starnix.net"
    gethomepage.dev/pod-selector: "app=radiacode-analyzer"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - radiacode.starnix.net
    secretName: radiacode-analyzer-tls
  rules:
  - host: radiacode.starnix.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: radiacode-analyzer-service
            port:
              number: 8080
