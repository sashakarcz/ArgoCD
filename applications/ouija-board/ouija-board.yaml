---
apiVersion: v1
kind: Namespace
metadata:
  name: ouija-board
  labels:
    app: ouija-board
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ouija-board
  namespace: ouija-board
  labels:
    app: ouija-board
  annotations:
    # Auto-restart when the shared gemini-api-key secret rotates.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ouija-board
  template:
    metadata:
      labels:
        app: ouija-board
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
      - name: ouija-board
        image: astrognome/ouija-board:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        # Same Gemini API key as gtarot (Vault: cluster/gemini-api-key).
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-api-key
              key: GEMINI_API_KEY
        # Own model (separate free-tier quota from gtarot's gemini-2.5-flash,
        # so the two never compete). Change here (no rebuild) on model rotation.
        - name: GEMINI_MODEL
          value: "gemini-2.5-flash-lite"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: ouija-board
  namespace: ouija-board
  labels:
    app: ouija-board
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Ouija Board"
    gethomepage.dev/description: "AI Spirit Board"
    gethomepage.dev/group: "Apps"
    gethomepage.dev/icon: "mdi-ghost"
    gethomepage.dev/href: "https://ouija.starnix.net"
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: ouija-board
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ouija-board-ingress
  namespace: ouija-board
  labels:
    app: ouija-board
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - ouija.service.starnix.net
    secretName: ouija-board-tls
  rules:
  - host: ouija.service.starnix.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ouija-board
            port:
              number: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: ouija-board
---
# gemini-api-key: synced from OpenBao secret/cluster/gemini-api-key via ESO (ClusterSecretStore 'openbao').
# Migrated from a VSO VaultStaticSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gemini-api-key
  namespace: ouija-board
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: gemini-api-key
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster/gemini-api-key
