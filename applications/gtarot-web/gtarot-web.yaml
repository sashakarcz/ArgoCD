apiVersion: v1
kind: Namespace
metadata:
  name: gtarot-web
  labels:
    app: gtarot-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gtarot-web
  namespace: gtarot-web
  labels:
    app: gtarot-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gtarot-web
  template:
    metadata:
      labels:
        app: gtarot-web
    spec:
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: gtarot-web
        image: astrognome/gtarot-web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-api-key
              key: GEMINI_API_KEY
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: gtarot-web-service
  namespace: gtarot-web
  labels:
    app: gtarot-web
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: gtarot-web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gtarot-web-ingress
  namespace: gtarot-web
  labels:
    app: gtarot-web
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - tarot.starnix.net
    secretName: gtarot-web-tls
  rules:
  - host: tarot.starnix.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gtarot-web-service
            port:
              number: 8080
