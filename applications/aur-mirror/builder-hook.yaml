---
# On-add build trigger. ArgoCD runs this Job as a PostSync hook whenever the
# aur-mirror app syncs -- notably when a package is added to allowlist.yaml --
# so a new package is built within minutes instead of waiting for the 02:00
# nightly cron. aur-build-all skips up-to-date packages, so a sync-triggered
# run only builds what changed.
#
# hook-delete-policy BeforeHookCreation: ArgoCD deletes the previous instance
# of this Job before each new sync, so re-runs use the stable name and the last
# run stays visible for debugging.
#
# IMPORTANT: the pod spec below intentionally mirrors the CronJob in
# builder.yaml (YAML anchors cannot span the two documents). Keep them in sync
# -- image, env, volumes, resources. The flock on /repo/.build.lock serializes
# this job against the nightly cron so they never write the repo db / sign
# concurrently.
apiVersion: batch/v1
kind: Job
metadata:
  name: aur-builder-onsync
  namespace: aur-mirror
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  # Build time plus headroom to wait on the flock if a nightly run is still
  # in progress when an add lands.
  activeDeadlineSeconds: 36000
  template:
    metadata:
      labels:
        app: aur-builder
    spec:
      restartPolicy: OnFailure
      # The build phase runs untrusted PKGBUILD code; deny it a ServiceAccount
      # token so a malicious build cannot reach the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: repo
          persistentVolumeClaim:
            claimName: aur-mirror-pvc
        - name: allowlist
          configMap:
            name: aur-allowlist
        - name: gpg-home
          emptyDir: {}
        - name: build-dir
          emptyDir:
            sizeLimit: 50Gi
        - name: lock
          # Coordination volume for the build flock, separate from the repo so
          # the build phase can mount /repo read-only.
          persistentVolumeClaim:
            claimName: aur-mirror-lock-pvc
      initContainers:
        # Phase 1: build (untrusted PKGBUILD code). No GPG key mounted here, so
        # a malicious build cannot exfiltrate it. Vetted artifacts are staged on
        # build-dir for the sign phase. Runs to completion before the signer.
        - name: build
          image: registry.starnix.net/library/aur-builder:latest
          # flock: blocks until the nightly cron (if running) releases the lock,
          # then builds -- so the two never build concurrently.
          command:
            - flock
            - /lock/.build.lock
            - /usr/local/bin/aur-build-all
          env:
            - name: BUILD_PHASE
              value: build
            - name: REPO_DIR
              value: /repo
            - name: BUILD_DIR
              value: /build
            - name: ALLOWLIST
              value: /config/allowlist.yaml
            - name: REPO_NAME
              value: aur-mirror
            - name: TRIVY_FAIL_SEVERITY
              value: "HIGH,CRITICAL"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aur-api-key
                  key: ANTHROPIC_API_KEY
                  optional: true
          volumeMounts:
            # Untrusted build code only READS the repo; only the signer writes.
            - name: repo
              mountPath: /repo
              readOnly: true
            - name: lock
              mountPath: /lock
            - name: allowlist
              mountPath: /config
            - name: build-dir
              mountPath: /build
          resources:
            requests:
              cpu: 2
              memory: 4Gi
              ephemeral-storage: 10Gi
            limits:
              cpu: 4
              memory: 12Gi
              ephemeral-storage: 50Gi
        # Phase 2 prep: import the GPG key into gpg-home (only the signer mounts
        # it), after the untrusted build init container has finished.
        - name: gpg-init
          image: registry.starnix.net/library/aur-builder:latest
          command:
            - sh
            - -c
            - |
              set -e
              export GNUPGHOME=/gpg/gnupg
              mkdir -p "$GNUPGHOME"
              chmod 700 "$GNUPGHOME"
              echo "$GPG_PRIVATE_KEY" | gpg --batch --import
              echo "GPG key imported: $GPG_KEY_ID"
          env:
            - name: GPG_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: aur-signing-key
                  key: GPG_PRIVATE_KEY
            - name: GPG_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aur-signing-key
                  key: GPG_KEY_ID
          volumeMounts:
            - name: gpg-home
              mountPath: /gpg
      containers:
        # Phase 2: sign + publish. Only container holding the key; runs no
        # PKGBUILD code. Reads staged artifacts, signs, repo-adds, pushes metrics.
        - name: signer
          image: registry.starnix.net/library/aur-builder:latest
          command:
            - flock
            - /lock/.build.lock
            - /usr/local/bin/aur-build-all
          env:
            - name: BUILD_PHASE
              value: sign
            - name: GNUPGHOME
              value: /gpg/gnupg
            - name: GPG_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aur-signing-key
                  key: GPG_KEY_ID
            - name: REPO_DIR
              value: /repo
            - name: BUILD_DIR
              value: /build
            - name: REPO_NAME
              value: aur-mirror
            - name: PUSHGATEWAY_URL
              value: "http://prometheus-pushgateway.monitoring.svc.cluster.local:9091"
          volumeMounts:
            # Signer is the ONLY writer of the published repo.
            - name: repo
              mountPath: /repo
            - name: lock
              mountPath: /lock
            - name: gpg-home
              mountPath: /gpg
            - name: build-dir
              mountPath: /build
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: 1
              memory: 2Gi
              ephemeral-storage: 5Gi
