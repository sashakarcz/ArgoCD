---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: aur-mirror
---
# aur-api-key: synced from OpenBao secret/cluster/aur-api-key via ESO (ClusterSecretStore 'openbao').
# Migrated from a VSO VaultStaticSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aur-api-key
  namespace: aur-mirror
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: aur-api-key
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster/aur-api-key
---
# aur-signing-key: synced from OpenBao secret/cluster/aur-signing-key via ESO (ClusterSecretStore 'openbao').
# Migrated from a VSO VaultStaticSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aur-signing-key
  namespace: aur-mirror
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: aur-signing-key
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster/aur-signing-key
