---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: aur-mirror

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: default
  namespace: aur-mirror
spec:
  method: jwt
  mount: kubernetes
  jwt:
    role: cluster
    serviceAccount: vault-auth
    audiences:
      - vault

---
# Vault secret must contain:
#   GPG_PRIVATE_KEY   - ASCII-armored GPG private key for signing packages
#   GPG_KEY_ID        - Key ID (short or long form) used with gpg --detach-sign
#   GPG_PASSPHRASE    - Passphrase for the GPG key (use empty string if none)
#
# Create with:
#   vault kv put secret/cluster/aur-signing-key \
#     GPG_PRIVATE_KEY="$(gpg --armor --export-secret-keys <KEY_ID>)" \
#     GPG_KEY_ID="<KEY_ID>" \
#     GPG_PASSPHRASE="<PASSPHRASE>"
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: aur-api-key
  namespace: aur-mirror
spec:
  type: kv-v2
  mount: secret
  path: cluster/aur-api-key
  vaultAuthRef: default
  destination:
    name: aur-api-key
    create: true
  refreshAfter: 24h

# Vault secret must contain:
#   ANTHROPIC_API_KEY  - API key for Claude PKGBUILD security scanning
#
# Create with:
#   vault kv put secret/cluster/aur-api-key ANTHROPIC_API_KEY="sk-ant-..."

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: aur-signing-key
  namespace: aur-mirror
spec:
  type: kv-v2
  mount: secret
  path: cluster/aur-signing-key
  vaultAuthRef: default
  destination:
    name: aur-signing-key
    create: true
  refreshAfter: 24h
