---
# Builder image: registry.starnix.net/library/aur-builder
# See applications/aur-mirror/Dockerfile for the image definition.
# Harbor's built-in Trivy will scan the builder image itself.
#
# Build, push, then re-pin the digest below so the pods run an immutable image
# (push access to Harbor must not be able to swap the signer's code):
#   docker build -t registry.starnix.net/library/aur-builder:latest .
#   docker push registry.starnix.net/library/aur-builder:latest
#   ./pin-image.sh        # rewrites the @sha256: pins in this dir + pac to HEAD
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aur-builder
  namespace: aur-mirror
spec:
  # Run nightly at 02:00
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # Abort if still running after 8 hours (headroom for a full from-scratch
      # build of all packages, incl. monster C++ compiles like ladybird,
      # qt5-webengine, webkit2gtk). Steady-state nightlies skip unchanged
      # packages and finish far faster.
      activeDeadlineSeconds: 28800
      template:
        metadata:
          labels:
            app: aur-builder
        spec:
          restartPolicy: OnFailure
          # The build phase runs untrusted PKGBUILD code; it has no need for the
          # Kubernetes API, so don't hand it a ServiceAccount token it could use
          # to reach the API server if a build is malicious.
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            # Constrain syscalls for every container in the pod. Compatible with
            # makepkg's sudo (RuntimeDefault permits the setuid path); it just
            # blocks the obscure syscalls a build-time exploit would reach for.
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: repo
              persistentVolumeClaim:
                claimName: aur-mirror-pvc
            - name: allowlist
              configMap:
                name: aur-allowlist
            # Commit-pin lock (machine-maintained by aur-lock, reviewed via git).
            # The build phase builds ONLY the commits pinned here.
            - name: aur-lock
              configMap:
                name: aur-lock
            - name: gpg-home
              emptyDir: {}
            - name: build-dir
              # Node-disk-backed scratch (NOT medium: Memory) so build trees
              # don't count against the container memory limit. Nodes have
              # ~86Gi ephemeral; 50Gi caps runaway while leaving headroom.
              # Holds each package's build tree (cleaned after each package)
              # plus the staged, vetted artifacts awaiting the sign phase.
              emptyDir:
                sizeLimit: 50Gi
            - name: lock
              # Dedicated coordination volume for the build flock, separate from
              # the published repo so the build phase can mount /repo read-only.
              persistentVolumeClaim:
                claimName: aur-mirror-lock-pvc
          initContainers:
            # Phase 1: build. Fetch, Claude-scan, makepkg, Trivy -- this is where
            # untrusted PKGBUILD code executes. The GPG signing key is NOT
            # mounted here, so a malicious build cannot exfiltrate it. Vetted
            # artifacts are staged on build-dir for the sign phase. Runs as an
            # init container so it completes before the signer starts.
            - name: build
              image: registry.starnix.net/library/aur-builder@sha256:b3c89165ab0ad5d5b525211b53b5231955239b7836a93b3c248c62ac7cc31cd3
              # flock serializes against the PostSync on-add job (builder-hook)
              # so a nightly run and an on-add run never build concurrently.
              command:
                - flock
                - /lock/.build.lock
                - /usr/local/bin/aur-build-all
              env:
                - name: BUILD_PHASE
                  value: build
                - name: REPO_DIR
                  value: /repo
                - name: BUILD_DIR
                  value: /build
                - name: ALLOWLIST
                  value: /config/allowlist.yaml
                - name: REPO_NAME
                  value: aur-mirror
                # Hold the package if Trivy finds vulns at this severity or above
                - name: TRIVY_FAIL_SEVERITY
                  value: "HIGH,CRITICAL"
                # No ANTHROPIC_API_KEY here: the Claude recipe scan moved to
                # aur-lock (CI), so untrusted build code never sees the key.
              volumeMounts:
                # Untrusted build code only READS the repo (skip-if-up-to-date
                # checks the DB); only the signer writes published artifacts.
                - name: repo
                  mountPath: /repo
                  readOnly: true
                - name: lock
                  mountPath: /lock
                - name: aur-lock
                  mountPath: /config-lock
                  readOnly: true
                - name: allowlist
                  mountPath: /config
                - name: build-dir
                  mountPath: /build
              resources:
                requests:
                  cpu: 2
                  memory: 4Gi
                  ephemeral-storage: 10Gi
                limits:
                  cpu: 4
                  # Headroom for C++-heavy compiles (qt5-webengine, webkit,
                  # build2). With /build on node disk this is now real compiler
                  # memory, not build-tree storage.
                  memory: 12Gi
                  ephemeral-storage: 50Gi
            # Phase 2 prep: import the GPG signing key into gpg-home, which only
            # the signer (below) mounts. Runs after the build init container, so
            # the key is never present while untrusted build code is executing.
            - name: gpg-init
              image: registry.starnix.net/library/aur-builder@sha256:b3c89165ab0ad5d5b525211b53b5231955239b7836a93b3c248c62ac7cc31cd3
              command:
                - sh
                - -c
                - |
                  set -e
                  # Use a subdir of the mount: with fsGroup the mount root
                  # (/gpg) is owned root:1000 and can't be chmod'd by uid 1000.
                  # A subdir we create ourselves is owned 1000:1000.
                  export GNUPGHOME=/gpg/gnupg
                  mkdir -p "$GNUPGHOME"
                  chmod 700 "$GNUPGHOME"
                  echo "$GPG_PRIVATE_KEY" | gpg --batch --import
                  echo "GPG key imported: $GPG_KEY_ID"
              env:
                - name: GPG_PRIVATE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: aur-signing-key
                      key: GPG_PRIVATE_KEY
                - name: GPG_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: aur-signing-key
                      key: GPG_KEY_ID
              volumeMounts:
                - name: gpg-home
                  mountPath: /gpg
          containers:
            # Phase 2: sign + publish. Reads the staged artifacts, GPG-signs and
            # repo-adds them, prunes, and pushes metrics. This is the only
            # container that holds the key, and it never runs PKGBUILD code.
            - name: signer
              image: registry.starnix.net/library/aur-builder@sha256:b3c89165ab0ad5d5b525211b53b5231955239b7836a93b3c248c62ac7cc31cd3
              command:
                - flock
                - /lock/.build.lock
                - /usr/local/bin/aur-build-all
              env:
                - name: BUILD_PHASE
                  value: sign
                - name: GNUPGHOME
                  value: /gpg/gnupg
                - name: GPG_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: aur-signing-key
                      key: GPG_KEY_ID
                - name: REPO_DIR
                  value: /repo
                - name: BUILD_DIR
                  value: /build
                - name: REPO_NAME
                  value: aur-mirror
                - name: PUSHGATEWAY_URL
                  value: "http://prometheus-pushgateway.monitoring.svc.cluster.local:9091"
              volumeMounts:
                # Signer is the ONLY writer of the published repo.
                - name: repo
                  mountPath: /repo
                - name: lock
                  mountPath: /lock
                - name: gpg-home
                  mountPath: /gpg
                - name: build-dir
                  mountPath: /build
              # The signer never runs PKGBUILD code or sudo, so it can be locked
              # down hard: no privilege escalation, no Linux capabilities.
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                  ephemeral-storage: 1Gi
                limits:
                  cpu: 1
                  memory: 2Gi
                  ephemeral-storage: 5Gi
