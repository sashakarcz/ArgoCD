---
# Builder image: registry.starnix.net/library/aur-builder
# See applications/aur-mirror/Dockerfile for the image definition.
# Harbor's built-in Trivy will scan the builder image itself.
#
# Build and push manually once, then Harbor keeps it updated:
#   docker build -t registry.starnix.net/library/aur-builder:latest .
#   docker push registry.starnix.net/library/aur-builder:latest
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aur-builder
  namespace: aur-mirror
spec:
  # Run nightly at 02:00
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # Abort if still running after 8 hours (headroom for a full from-scratch
      # build of all packages, incl. monster C++ compiles like ladybird,
      # qt5-webengine, webkit2gtk). Steady-state nightlies skip unchanged
      # packages and finish far faster.
      activeDeadlineSeconds: 28800
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          volumes:
            - name: repo
              persistentVolumeClaim:
                claimName: aur-mirror-pvc
            - name: allowlist
              configMap:
                name: aur-allowlist
            - name: gpg-home
              emptyDir: {}
            - name: build-dir
              # Node-disk-backed scratch (NOT medium: Memory) so build trees
              # don't count against the container memory limit. Nodes have
              # ~86Gi ephemeral; 50Gi caps runaway while leaving headroom.
              # aur-build-all cleans each package's dir after publish, so peak
              # usage stays at roughly one package.
              emptyDir:
                sizeLimit: 50Gi
          initContainers:
            # Import GPG signing key from Vault secret before main build starts
            - name: gpg-init
              image: registry.starnix.net/library/aur-builder:latest
              command:
                - sh
                - -c
                - |
                  set -e
                  # Use a subdir of the mount: with fsGroup the mount root
                  # (/gpg) is owned root:1000 and can't be chmod'd by uid 1000.
                  # A subdir we create ourselves is owned 1000:1000.
                  export GNUPGHOME=/gpg/gnupg
                  mkdir -p "$GNUPGHOME"
                  chmod 700 "$GNUPGHOME"
                  echo "$GPG_PRIVATE_KEY" | gpg --batch --import
                  echo "GPG key imported: $GPG_KEY_ID"
              env:
                - name: GPG_PRIVATE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: aur-signing-key
                      key: GPG_PRIVATE_KEY
                - name: GPG_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: aur-signing-key
                      key: GPG_KEY_ID
              volumeMounts:
                - name: gpg-home
                  mountPath: /gpg
          containers:
            - name: builder
              image: registry.starnix.net/library/aur-builder:latest
              # Serialize repo writes against the PostSync on-add job
              # (builder-hook.yaml) with a flock on the shared NFS PVC, so a
              # nightly run and an on-add run never repo-add/sign concurrently.
              command:
                - flock
                - /repo/.build.lock
                - /usr/local/bin/aur-build-all
              env:
                - name: GNUPGHOME
                  value: /gpg/gnupg
                - name: GPG_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: aur-signing-key
                      key: GPG_KEY_ID
                - name: REPO_DIR
                  value: /repo
                - name: BUILD_DIR
                  value: /build
                - name: ALLOWLIST
                  value: /config/allowlist.yaml
                - name: REPO_NAME
                  value: aur-mirror
                # Fail the build if Trivy finds vulns at this severity or above
                - name: TRIVY_FAIL_SEVERITY
                  value: "HIGH,CRITICAL"
                - name: PUSHGATEWAY_URL
                  value: "http://prometheus-pushgateway.monitoring.svc.cluster.local:9091"
                - name: ANTHROPIC_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: aur-api-key
                      key: ANTHROPIC_API_KEY
                      optional: true
              volumeMounts:
                - name: repo
                  mountPath: /repo
                - name: allowlist
                  mountPath: /config
                - name: gpg-home
                  mountPath: /gpg
                - name: build-dir
                  mountPath: /build
              resources:
                requests:
                  cpu: 2
                  memory: 4Gi
                  ephemeral-storage: 10Gi
                limits:
                  cpu: 4
                  # Headroom for C++-heavy compiles (qt5-webengine, webkit,
                  # build2). With /build on node disk this is now real compiler
                  # memory, not build-tree storage.
                  memory: 12Gi
                  ephemeral-storage: 50Gi
