---
# Note: nsscache-secrets must be created manually in the cluster:
# kubectl create secret generic nsscache-secrets -n nsscache \
#   --from-literal=ldap-bind-password='YOUR_LDAP_PASSWORD'
---
apiVersion: v1
kind: Namespace
metadata:
  name: nsscache
  labels:
    app: nsscache
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nsscache-config
  namespace: nsscache
data:
  config.yaml: |
    ldap:
      host: "ipa9.starnix.net"
      port: 636
      use_tls: true
      skip_verify: true
      bind_dn: "uid=svc_nsscache,cn=users,cn=accounts,dc=starnix,dc=net"
      base_dn: "cn=accounts,dc=starnix,dc=net"
      user_filter: "(objectClass=posixAccount)"
      group_filter: "(objectClass=posixGroup)"
      shadow_filter: "(objectClass=shadowAccount)"
    cache:
      ttl: 300
    server:
      listen: ":8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nsscache
  namespace: nsscache
  labels:
    app: nsscache
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nsscache
  template:
    metadata:
      labels:
        app: nsscache
    spec:
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: nsscache
        image: astrognome/nsscache-http:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: LDAP_BIND_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nsscache-secrets
              key: ldap-bind-password
        volumeMounts:
        - name: config
          mountPath: /etc/nsscache
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: nsscache-config
---
apiVersion: v1
kind: Service
metadata:
  name: nsscache
  namespace: nsscache
  labels:
    app: nsscache
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "NSSCache"
    gethomepage.dev/description: "LDAP Cache Server"
    gethomepage.dev/group: "Security"
    gethomepage.dev/icon: "mdi-account-sync"
    gethomepage.dev/href: "https://nsscache.starnix.net"
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: nsscache
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nsscache-ingress
  namespace: nsscache
  labels:
    app: nsscache
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "NSSCache"
    gethomepage.dev/description: "LDAP Cache Server"
    gethomepage.dev/group: "Security"
    gethomepage.dev/icon: "mdi-account-sync"
    gethomepage.dev/href: "https://nsscache.starnix.net"
    gethomepage.dev/pod-selector: "app=nsscache"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - nsscache.starnix.net
    secretName: nsscache-tls
  rules:
  - host: nsscache.starnix.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nsscache
            port:
              number: 80
---
# nsscache-secrets: synced from OpenBao secret/cluster/nsscache-secrets via ESO (ClusterSecretStore 'openbao').
# Migrated from a VSO VaultStaticSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nsscache-secrets
  namespace: nsscache
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: nsscache-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster/nsscache-secrets
---
# Egress lockdown for this internet-exposed namespace. nsscache only syncs
# user/group/shadow maps from FreeIPA (ipa9.starnix.net -> 192.168.1.26) over
# LDAP and serves the cache on :8080 (ingress, unaffected). It needs NOTHING
# else outbound -- not the internet, not the k8s API, not other namespaces, not
# the rest of the LAN -- so this is the tightest policy of the set: DNS to
# CoreDNS + FreeIPA only. A compromise here can't pivot or exfiltrate.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nsscache-egress-lockdown
  namespace: nsscache
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # DNS to CoreDNS (to resolve ipa9.starnix.net)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # FreeIPA (ipa9, 192.168.1.26) -- the only host nsscache talks to (LDAP simple bind)
    - to:
        - ipBlock:
            cidr: 192.168.1.26/32
