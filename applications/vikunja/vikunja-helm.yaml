apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vikunja-helm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/go-vikunja/helm-chart
    chart: vikunja
    targetRevision: 2.0.0
    helm:
      releaseName: vikunja
      values: |
        vikunja:
          image:
            repository: vikunja/vikunja
            tag: "1.0.0"

          ingress:
            main:
              enabled: true
              ingressClassName: traefik
              annotations:
                cert-manager.io/cluster-issuer: "letsencrypt-production"
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
                gethomepage.dev/enabled: "true"
                gethomepage.dev/name: "Vikunja"
                gethomepage.dev/description: "Task Management"
                gethomepage.dev/group: "Tools"
                gethomepage.dev/icon: "vikunja.png"
                gethomepage.dev/href: "https://project.starnix.net"
              hosts:
                - host: project.starnix.net
                  paths:
                    - path: /
              tls:
                - secretName: vikunja-tls
                  hosts:
                    - project.starnix.net

          persistence:
            data:
              enabled: true
              accessMode: ReadWriteOnce
              size: 5Gi
              storageClass: longhorn
              mountPath: /app/vikunja/files
            database:
              enabled: false

          env:
            VIKUNJA_DATABASE_TYPE: postgres
            VIKUNJA_DATABASE_HOST: vikunja-postgres
            VIKUNJA_DATABASE_DATABASE: vikunja
            VIKUNJA_DATABASE_USER: vikunja
            VIKUNJA_DATABASE_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: vikunja-secrets
                  key: dbPassword
            VIKUNJA_SERVICE_PUBLICURL: "https://project.starnix.net"
          configMaps:
            config:
              enabled: true
              data:
                config.yml: |
                  # managed by ArgoCD ignoreDifferences + VSO patch

  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: vikunja-config
      namespace: vikunja
      jqPathExpressions:
        - .data["config.yml"]

  destination:
    server: https://kubernetes.default.svc
    namespace: vikunja
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
