---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: vikunja

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: default
  namespace: vikunja
spec:
  method: jwt
  mount: kubernetes
  jwt:
    role: cluster
    serviceAccount: vault-auth
    audiences:
      - vault

---
# Vault secret must contain:
#   clientId          - Authentik OIDC client ID
#   clientSecret      - Authentik OIDC client secret
#   postgres-password - PostgreSQL superuser password
#   dbPassword        - Vikunja database user password
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vikunja-secrets
  namespace: vikunja
spec:
  type: kv-v2
  mount: secret
  path: cluster/vikunja-secrets
  vaultAuthRef: default
  destination:
    name: vikunja-secrets
    create: true
  refreshAfter: 1h

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vikunja-postgres-data
  namespace: vikunja
  labels:
    recurring-job-group.longhorn.io/default: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja-postgres
  namespace: vikunja
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vikunja-postgres
  template:
    metadata:
      labels:
        app: vikunja-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_DB
          value: vikunja
        - name: POSTGRES_USER
          value: vikunja
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vikunja-secrets
              key: dbPassword
        - name: POSTGRES_INITDB_ARGS
          value: "--auth-host=scram-sha-256"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: pgdata
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          exec:
            command: [pg_isready, -U, vikunja]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: [pg_isready, -U, vikunja]
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: vikunja-postgres-data

---
apiVersion: v1
kind: Service
metadata:
  name: vikunja-postgres
  namespace: vikunja
spec:
  selector:
    app: vikunja-postgres
  ports:
  - port: 5432
    targetPort: 5432
