---
# vikunja-secrets: synced from OpenBao secret/cluster/vikunja-secrets via ESO (ClusterSecretStore 'openbao').
# Migrated from a VSO VaultStaticSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja-secrets
  namespace: vikunja
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: vikunja-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster/vikunja-secrets
---
# vikunja-config: synced from OpenBao secret/cluster/vikunja-secrets via ESO (ClusterSecretStore 'openbao').
# Migrated from a VSO VaultStaticSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja-config
  namespace: vikunja
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: vikunja-config
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster/vikunja-secrets
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vikunja-postgres-data
  namespace: vikunja
  labels:
    recurring-job-group.longhorn.io/default: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja-postgres
  namespace: vikunja
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vikunja-postgres
  template:
    metadata:
      labels:
        app: vikunja-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_DB
          value: vikunja
        - name: POSTGRES_USER
          value: vikunja
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vikunja-secrets
              key: dbPassword
        - name: POSTGRES_INITDB_ARGS
          value: "--auth-host=scram-sha-256"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: pgdata
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          exec:
            command: [pg_isready, -U, vikunja]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: [pg_isready, -U, vikunja]
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: vikunja-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: vikunja-postgres
  namespace: vikunja
spec:
  selector:
    app: vikunja-postgres
  ports:
  - port: 5432
    targetPort: 5432
