---
# 1. Namespace
# A dedicated namespace for Overseerr resources.
apiVersion: v1
kind: Namespace
metadata:
  name: overseerr
  labels:
    name: overseerr
---
# 2. PersistentVolumeClaim
# A claim for the NFS volume, which the Overseerr pod will use.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: overseerr-config
  namespace: overseerr
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn
  volumeName: overseerr-config-restored-pv


---
# 4. Deployment
# Manages the Overseerr application pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overseerr
  namespace: overseerr
  labels:
    app: overseerr
spec:
  replicas: 1
  # RWO volume + one-way DB migration: never run two pods on the config at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: overseerr
  template:
    metadata:
      labels:
        app: overseerr
    spec:
      # Seerr runs as the node user (UID 1000); fsGroup makes Longhorn fix
      # ownership of the (previously root-owned) config volume on mount.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: overseerr
        # Seerr: merged successor to Overseerr + Jellyseerr; auto-migrates the
        # existing Jellyseerr config/DB on first start. (was fallenbagel/jellyseerr:latest)
        image: ghcr.io/seerr-team/seerr:latest
        ports:
        - containerPort: 5055
          name: http
        env:
        # PUID/PGID removed -- Seerr uses the pod securityContext (UID 1000), not LSIO-style vars
        - name: TZ
          value: "America/Chicago"
        resources:
          requests:
            cpu: 200m
            memory: 4Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
      volumes:
      - name: config-volume
        persistentVolumeClaim:
          claimName: overseerr-config

---
# 5. Service
# Exposes the Overseerr deployment internally to the cluster.
apiVersion: v1
kind: Service
metadata:
  name: overseerr-service
  namespace: overseerr
  labels:
    app: overseerr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Seerr"
    gethomepage.dev/description: "Media Request Manager"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "jellyseerr.png"
    gethomepage.dev/href: "https://media.starnix.net"
spec:
  selector:
    app: overseerr
  ports:
    - protocol: TCP
      port: 5055
      targetPort: 5055
  type: ClusterIP

---
# 6. Ingress with NGINX and Cert-Manager
# Configures external access and automates SSL with cert-manager.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: overseerr-ingress
  namespace: overseerr
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Seerr"
    gethomepage.dev/description: "Media Request Manager"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "jellyseerr.png"
    gethomepage.dev/href: "https://media.starnix.net"
    gethomepage.dev/pod-selector: "app=overseerr"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - media.starnix.net
    secretName: overseerr-tls-cert
  rules:
  - host: media.starnix.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: overseerr-service
            port:
              number: 5055
