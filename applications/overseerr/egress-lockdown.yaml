# Egress policy (internet-exposed) -- this app legitimately talks to LAN hosts/devices, so the LAN is allowed but the CLUSTER pivot is blocked: no k8s API, no other namespaces' pods/services, no cluster nodes/MetalLB, no Tailscale. DNS + own namespace + LAN + internet allowed. NFS PVs node-side, unaffected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: overseerr-egress-lockdown
  namespace: overseerr
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # DNS to CoreDNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # within its own namespace
    - to:
        - podSelector: {}
    # LAN + public internet; block only the cluster (pods/svc/API = 10/8),
    # the cluster node subnet + MetalLB (192.168.7.0/24), Tailscale, link-local
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
              - 192.168.7.0/24
              - 169.254.0.0/16
              - 100.64.0.0/10
