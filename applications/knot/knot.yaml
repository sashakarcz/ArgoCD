---
apiVersion: v1
kind: Namespace
metadata:
  name: knot
  labels:
    name: knot
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: knot-config
  namespace: knot
data:
  knot.conf: |
    server:
        listen: 0.0.0.0@53
        rundir: /rundir

    control:
        listen: /rundir/knot.sock

    log:
      - target: stderr
        any: info

    # TSIG key + ACL for ExternalDNS dynamic updates live in a Secret,
    # not in git. The include pulls them in at runtime.
    include: /secrets/knot-keys.conf

    template:
      - id: default
        # git-sync writes to /storage/git/zones (symlink to latest checkout)
        storage: /storage/git/zones

    zone:
      - domain: starnix.net
        file: starnix.net.zone
        # difference: only apply changes from the zone file on reload,
        # leaving journal entries (ExternalDNS records) untouched.
        zonefile-load: difference
        # Keep all records in the journal, not just deltas.
        journal-content: all
        # Never write dynamic updates back to the zone file; git is the
        # source of truth for static records.
        zonefile-sync: -1
        acl: [externaldns-update]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knot
  namespace: knot
  labels:
    app: knot
spec:
  # Single replica required: Longhorn PVC is ReadWriteOnce, and RFC 2136
  # updates must land on the same pod that owns the journal.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: knot
  template:
    metadata:
      labels:
        app: knot
    spec:
      # git-sync runs as uid/gid 65533. fsGroup makes the Longhorn PVC
      # root group-writable so git-sync can create its working directory.
      securityContext:
        fsGroup: 65533
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - talos-dg8-q1t
      volumes:
      - name: knot-config
        configMap:
          name: knot-config
      - name: zone-data
        emptyDir: {}
      - name: knot-secrets
        secret:
          secretName: knot-secrets
      - name: rundir
        emptyDir: {}
      initContainers:
      - name: git-sync-init
        image: registry.k8s.io/git-sync/git-sync:v4.4.0
        args:
        - --repo=https://github.com/usenix17/dns.git
        - --ref=main
        - --root=/data/git
        - --link=zones
        - --one-time
        volumeMounts:
        - name: zone-data
          # Mount at /data so git-sync owns /data/git, never touching
          # the PVC root where lost+found lives.
          mountPath: /data
      containers:
      - name: knot
        image: cznic/knot:3.4
        command: ["knotd"]
        ports:
        - containerPort: 53
          name: dns-tcp
          protocol: TCP
        - containerPort: 53
          name: dns-udp
          protocol: UDP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
        - name: knot-config
          mountPath: /config
        - name: zone-data
          mountPath: /storage
        - name: knot-secrets
          mountPath: /secrets
          readOnly: true
        - name: rundir
          mountPath: /rundir
        livenessProbe:
          exec:
            command:
            - kdig
            - "@127.0.0.1"
            - starnix.net
            - SOA
            - +short
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - kdig
            - "@127.0.0.1"
            - starnix.net
            - SOA
            - +short
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      - name: git-sync
        image: registry.k8s.io/git-sync/git-sync:v4.4.0
        args:
        - --repo=https://github.com/usenix17/dns.git
        - --ref=main
        - --root=/data/git
        - --link=zones
        - --period=60s
        - --max-failures=-1
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: zone-data
          mountPath: /data
      - name: reloader
        image: alpine:latest
        command:
        - /bin/sh
        - -c
        - |
          export PATH="/usr/sbin:/usr/bin:/sbin:/bin"
          until apk update && apk add --no-cache curl knot; do
            echo "Waiting for package install..."
            sleep 5
          done
          echo "knotc location: $(which knotc 2>&1 || echo 'not found')"
          LAST=""
          while true; do
            CURRENT=$(readlink /storage/git/zones 2>/dev/null)
            if [ "$CURRENT" != "$LAST" ] && [ -n "$CURRENT" ]; then
              echo "Zone update detected, reloading..."
              /usr/sbin/knotc -s /rundir/knot.sock zone-reload starnix.net 2>&1 || true
              curl -s -X POST http://apprise.apprise.svc:8000/notify/argocd \
                -H "Content-Type: application/json" \
                -d '{"title": "knot-dns", "body": "🔄 **starnix.net** zone reloaded from git."}' || true
              LAST="$CURRENT"
            fi
            sleep 5
          done
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - name: zone-data
          mountPath: /storage
        - name: rundir
          mountPath: /rundir
---
apiVersion: v1
kind: Service
metadata:
  name: knot
  namespace: knot
  labels:
    app: knot
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.7.211
  selector:
    app: knot
  ports:
  - name: dns-tcp
    port: 53
    targetPort: 53
    protocol: TCP
  - name: dns-udp
    port: 53
    targetPort: 53
    protocol: UDP
---
# knot-secrets: synced from OpenBao secret/cluster/knot-secrets via ESO (ClusterSecretStore 'openbao').
# Migrated from a VSO VaultStaticSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: knot-secrets
  namespace: knot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: knot-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster/knot-secrets
