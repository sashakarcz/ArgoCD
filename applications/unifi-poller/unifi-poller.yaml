---
apiVersion: v1
kind: Namespace
metadata:
  name: unifi-poller

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: unifi-poller

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: default
  namespace: unifi-poller
spec:
  method: jwt
  mount: kubernetes
  jwt:
    role: cluster
    serviceAccount: vault-auth
    audiences:
      - vault

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: unifi-poller-secrets
  namespace: unifi-poller
spec:
  type: kv-v2
  mount: secret
  path: cluster/unifi-poller-secrets
  vaultAuthRef: default
  destination:
    name: unifi-poller-secrets
    create: true
  refreshAfter: 1h

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi-poller
  namespace: unifi-poller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unifi-poller
  template:
    metadata:
      labels:
        app: unifi-poller
    spec:
      containers:
      - name: unifi-poller
        image: ghcr.io/unpoller/unpoller:latest
        ports:
        - name: metrics
          containerPort: 9130
        env:
        - name: UP_UNIFI_DEFAULT_URL
          value: "https://192.168.1.1"
        - name: UP_UNIFI_DEFAULT_VERIFY_SSL
          value: "false"
        - name: UP_INFLUXDB_DISABLE
          value: "true"
        - name: UP_PROMETHEUS_DISABLE
          value: "false"
        - name: UP_UNIFI_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: unifi-poller-secrets
              key: username
        - name: UP_UNIFI_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: unifi-poller-secrets
              key: password
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: unifi-poller
  namespace: unifi-poller
  labels:
    app: unifi-poller
spec:
  selector:
    app: unifi-poller
  ports:
  - name: metrics
    port: 9130
    targetPort: 9130

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: unifi-poller
  namespace: unifi-poller
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: unifi-poller
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
