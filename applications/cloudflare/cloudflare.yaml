---
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflare

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: cloudflare

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: default
  namespace: cloudflare
spec:
  method: jwt
  mount: kubernetes
  jwt:
    role: cluster
    serviceAccount: vault-auth
    audiences:
      - vault

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudflare-secrets
  namespace: cloudflare
spec:
  type: kv-v2
  mount: secret
  path: cluster/cloudflared-secrets
  vaultAuthRef: default
  destination:
    name: cloudflare-secrets
    create: true
  refreshAfter: 1h

