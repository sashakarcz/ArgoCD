---
apiVersion: v1
kind: Namespace
metadata:
  name: stash

---
# NFS PersistentVolume for video library
apiVersion: v1
kind: PersistentVolume
metadata:
  name: stash-data-pv
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nconnect=16
    - noatime
  nfs:
    server: "192.168.1.75"
    path: "/mnt/Store/sasha/sasha/sasha"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stash-data-pvc
  namespace: stash
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
  volumeName: stash-data-pv
  storageClassName: ""

---
# Longhorn PVC for config + SQLite database
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stash-config
  namespace: stash
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi

---
# Longhorn PVC for generated thumbnails/sprites/previews
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stash-generated
  namespace: stash
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi

---
# Baseline config pre-seeded on first run. Stash writes to the copy on
# the Longhorn PVC so UI changes persist; this ConfigMap is the source
# of truth for the initial path layout.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stash-config-seed
  namespace: stash
data:
  config.yml: |
    host: 0.0.0.0
    port: 9999
    stash:
    - path: /data
      excludes: []
      image_excludes: []
      video_excludes: []
      zip_file_extensions:
      - zip
      - cbz
    generated: /generated
    cache: /cache
    database: /root/.stash/stash-go.sqlite
    metadata: /root/.stash/metadata

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stash
  namespace: stash
  labels:
    app: stash
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stash
  template:
    metadata:
      labels:
        app: stash
    spec:
      securityContext:
        fsGroup: 105
        supplementalGroups: [44, 105]
      initContainers:
      - name: seed-config
        image: alpine:latest
        command:
        - sh
        - -c
        - |
          if [ ! -f /root/.stash/config.yml ]; then
            echo "Seeding config.yml from ConfigMap..."
            cp /seed/config.yml /root/.stash/config.yml
          else
            echo "config.yml already exists, skipping seed."
          fi
        volumeMounts:
        - name: config
          mountPath: /root/.stash
        - name: config-seed
          mountPath: /seed
          readOnly: true
      - name: install-vaapi-drivers
        image: alpine:latest
        command:
        - sh
        - -c
        - |
          apk add --no-cache intel-media-driver libva
          mkdir -p /vaapi-drivers/dri /vaapi-drivers/lib
          cp -r /usr/lib/dri/iHD* /vaapi-drivers/dri/
          cp /usr/lib/libigdgmm.so* /vaapi-drivers/lib/
          cp /usr/lib/libva*.so* /vaapi-drivers/lib/ 2>/dev/null || true
          cp /usr/lib/libmfx*.so* /vaapi-drivers/lib/ 2>/dev/null || true
        volumeMounts:
        - name: vaapi-drivers
          mountPath: /vaapi-drivers
      containers:
      - name: stash
        image: stashapp/stash:latest
        ports:
        - containerPort: 9999
          name: http
        env:
        - name: STASH_STASH
          value: /data
        - name: STASH_GENERATED
          value: /generated
        - name: STASH_CACHE
          value: /cache
        - name: LIBVA_DRIVERS_PATH
          value: /vaapi-drivers/dri
        - name: LIBVA_DRIVER_NAME
          value: iHD
        - name: LD_LIBRARY_PATH
          value: /vaapi-drivers/lib
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 4000m
            memory: 4Gi
        volumeMounts:
        - name: config
          mountPath: /root/.stash
        - name: data
          mountPath: /data
        - name: generated
          mountPath: /generated
        - name: cache
          mountPath: /cache
        - name: dev-dri
          mountPath: /dev/dri
        - name: vaapi-drivers
          mountPath: /vaapi-drivers
        livenessProbe:
          tcpSocket:
            port: 9999
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 9999
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: stash-config
      - name: config-seed
        configMap:
          name: stash-config-seed
      - name: data
        persistentVolumeClaim:
          claimName: stash-data-pvc
      - name: generated
        persistentVolumeClaim:
          claimName: stash-generated
      - name: cache
        emptyDir: {}
      - name: vaapi-drivers
        emptyDir: {}
      - name: dev-dri
        hostPath:
          path: /dev/dri
          type: Directory

---
apiVersion: v1
kind: Service
metadata:
  name: stash
  namespace: stash
spec:
  selector:
    app: stash
  ports:
  - port: 9999
    targetPort: 9999

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stash-ingress
  namespace: stash
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - stash.starnix.net
    secretName: stash-tls
  rules:
  - host: stash.starnix.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: stash
            port:
              number: 9999
