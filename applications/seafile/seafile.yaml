---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: seafile

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: default
  namespace: seafile
spec:
  method: jwt
  mount: kubernetes
  jwt:
    role: cluster
    serviceAccount: vault-auth
    audiences:
      - vault

---
# Vault secret must contain:
#   db-root-password    - MariaDB root password (used by Seafile init)
#   db-password         - Seafile DB user password
#   admin-password      - Initial Seafile admin password
#   jwt-private-key     - JWT signing key
#   s3-secret-key       - MinIO secret key
#   oidc-client-secret  - Authentik OIDC client secret
#   seahub-secret-key   - Django SECRET_KEY for Seahub
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: seafile-secrets
  namespace: seafile
spec:
  type: kv-v2
  mount: secret
  path: cluster/seafile-secrets
  vaultAuthRef: default
  destination:
    name: seafile-secrets
    create: true
  refreshAfter: 1h

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seafile-mariadb-data
  namespace: seafile
  labels:
    recurring-job-group.longhorn.io/default: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seafile-data
  namespace: seafile
  labels:
    recurring-job-group.longhorn.io/default: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seafile-mariadb
  namespace: seafile
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seafile-mariadb
  template:
    metadata:
      labels:
        app: seafile-mariadb
    spec:
      containers:
      - name: mariadb
        image: mariadb:10.11
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: seafile-secrets
              key: db-root-password
        - name: MYSQL_LOG_CONSOLE
          value: "true"
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
          subPath: mysql
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          exec:
            command: [mysqladmin, ping, -h, localhost]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: [mysqladmin, ping, -h, localhost]
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: seafile-mariadb-data

---
apiVersion: v1
kind: Service
metadata:
  name: seafile-mariadb
  namespace: seafile
spec:
  selector:
    app: seafile-mariadb
  ports:
  - port: 3306
    targetPort: 3306

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: seafile-env
  namespace: seafile
data:
  SEAFILE_SERVER_HOSTNAME: "seafile.starnix.net"
  SEAFILE_SERVER_PROTOCOL: "https"
  SEAFILE_LOG_TO_STDOUT: "true"
  SEAFILE_MYSQL_DB_HOST: "seafile-mariadb"
  SEAFILE_MYSQL_DB_PORT: "3306"
  SEAFILE_MYSQL_DB_USER: "seafile"
  SEAFILE_MYSQL_DB_CCNET_DB_NAME: "ccnet_db"
  SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: "seafile_db"
  SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: "seahub_db"
  INIT_SEAFILE_ADMIN_EMAIL: "admin@starnix.net"
  # S3/MinIO storage backend
  SEAF_SERVER_STORAGE_TYPE: "s3"
  S3_COMMIT_BUCKET: "seafile-commits"
  S3_FS_BUCKET: "seafile-fs"
  S3_BLOCK_BUCKET: "seafile-blocks"
  S3_KEY_ID: "seafile"
  S3_HOST: "192.168.1.150:9000"
  S3_PATH_STYLE_REQUEST: "true"
  S3_USE_V4_SIGNATURE: "true"
  S3_USE_HTTPS: "false"
  S3_AWS_REGION: "us-east-1"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seafile-redis
  namespace: seafile
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seafile-redis
  template:
    metadata:
      labels:
        app: seafile-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: seafile-redis
  namespace: seafile
spec:
  selector:
    app: seafile-redis
  ports:
  - port: 6379
    targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seafile
  namespace: seafile
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seafile
  template:
    metadata:
      labels:
        app: seafile
    spec:
      enableServiceLinks: false
      initContainers:
      - name: wait-for-db
        image: mariadb:10.11
        command:
        - sh
        - -c
        - until mysqladmin ping -h seafile-mariadb --silent; do echo "waiting for mariadb"; sleep 3; done
      - name: install-boto3
        image: python:3.11-slim
        command:
        - sh
        - -c
        - pip install boto3 --quiet --target /pip-packages
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: pip-packages
          mountPath: /pip-packages
      - name: oidc-patcher
        image: python:3.11-slim
        command:
        - python3
        - -c
        - |
          import os, sys
          conf = '/shared/seafile/conf/seahub_settings.py'
          if not os.path.exists(conf):
              print("seahub_settings.py not yet created by Seafile init; skipping OIDC patch (will apply on next start)")
              sys.exit(0)
          with open(conf) as f:
              content = f.read()
          if 'ENABLE_OAUTH' in content:
              print("OIDC settings already present; nothing to do")
              sys.exit(0)
          client_secret = os.environ['OAUTH_CLIENT_SECRET']
          seahub_secret = os.environ['SEAHUB_SECRET_KEY']
          patch = f"""
          # Settings appended by oidc-patcher init container
          SECRET_KEY = {seahub_secret!r}
          SERVICE_URL = 'https://seafile.starnix.net/'
          FILE_SERVER_ROOT = 'https://seafile.starnix.net/seafhttp'

          CACHES = {{
              'default': {{
                  'BACKEND': 'django_redis.cache.RedisCache',
                  'LOCATION': 'redis://seafile-redis:6379/0',
              }},
              'locmem': {{
                  'BACKEND': 'django.core.cache.backends.locmem.LocMemCache',
              }},
          }}
          COMPRESS_CACHE_BACKEND = 'locmem'

          ENABLE_OAUTH = True
          OAUTH_CREATE_UNKNOWN_USER = True
          OAUTH_ACTIVATE_USER_AFTER_CREATION = True
          OAUTH_CLIENT_ID = 'zT2fc0wKlYNF18AMxgiJ2Q4aOFWTilVzuDUwbFMZ'
          OAUTH_CLIENT_SECRET = {client_secret!r}
          OAUTH_REDIRECT_URL = 'https://seafile.starnix.net/oauth/callback/'
          OAUTH_PROVIDER_DOMAIN = 'auth.starnix.net'
          OAUTH_AUTHORIZATION_URL = 'https://auth.starnix.net/application/o/seafile/authorize/'
          OAUTH_TOKEN_URL = 'https://auth.starnix.net/application/o/token/'
          OAUTH_USER_INFO_URL = 'https://auth.starnix.net/application/o/userinfo/'
          OAUTH_SCOPE = ['openid', 'profile', 'email']
          OAUTH_ATTRIBUTE_MAP = {{
              'sub': (True, 'uid'),
              'name': (False, 'name'),
              'email': (False, 'contact_email'),
          }}
          """
          import textwrap
          with open(conf, 'a') as f:
              f.write(textwrap.dedent(patch))
          print("OIDC settings appended to seahub_settings.py")
        env:
        - name: OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: seafile-secrets
              key: oidc-client-secret
        - name: SEAHUB_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: seafile-secrets
              key: seahub-secret-key
        volumeMounts:
        - name: seafile-data
          mountPath: /shared
      containers:
      - name: seafile
        image: seafileltd/seafile-mc:13.0-latest
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: seafile-env
        env:
        - name: SEAFILE_MYSQL_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: seafile-secrets
              key: db-password
        - name: INIT_SEAFILE_MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: seafile-secrets
              key: db-root-password
        - name: INIT_SEAFILE_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: seafile-secrets
              key: admin-password
        - name: JWT_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: seafile-secrets
              key: jwt-private-key
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: seafile-secrets
              key: s3-secret-key
        - name: OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: seafile-secrets
              key: oidc-client-secret
        - name: SEAHUB_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: seafile-secrets
              key: seahub-secret-key
        - name: PYTHONPATH
          value: /pip-packages
        volumeMounts:
        - name: seafile-data
          mountPath: /shared
        - name: pip-packages
          mountPath: /pip-packages
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /api2/ping/
            port: 80
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api2/ping/
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 5
      volumes:
      - name: seafile-data
        persistentVolumeClaim:
          claimName: seafile-data
      - name: pip-packages
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: seafile
  namespace: seafile
spec:
  selector:
    app: seafile
  ports:
  - port: 80
    targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seafile
  namespace: seafile
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-production
    # Seafile uploads can be large
    traefik.ingress.kubernetes.io/router.middlewares: seafile-seafile-headers@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: seafile.starnix.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: seafile
            port:
              number: 80
  tls:
  - secretName: seafile-tls
    hosts:
    - seafile.starnix.net

---
# Increase body size limit for file uploads
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: seafile-headers
  namespace: seafile
spec:
  buffering:
    maxRequestBodyBytes: 0
