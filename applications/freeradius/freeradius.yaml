apiVersion: v1
kind: Namespace
metadata:
  name: freeradius
  labels: { name: freeradius }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: freeradius-secrets
  namespace: freeradius
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: freeradius-secrets }
  data:
    - secretKey: ldap_bind_password
      remoteRef: { key: cluster/freeradius, property: ldap_bind_password }
    - secretKey: radius_shared_secret
      remoteRef: { key: cluster/freeradius, property: radius_shared_secret }
---
# EAP server cert: issued + auto-renewed by certmonger on ipa9 from the FreeIPA
# Dogtag CA (split-horizon DNS makes cert-manager ACME dns-01 infeasible here --
# cert-manager checks the public/Cloudflare view, FreeIPA validates the internal/
# knot view, and one solver can't satisfy both). certmonger's post-save hook
# writes the cert into the radius-eap-tls Secret using this tightly-scoped
# ServiceAccount. radius-eap-tls itself is created/updated out-of-band by that
# hook, so it is intentionally NOT in git.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-pusher
  namespace: freeradius
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-pusher
  namespace: freeradius
rules:
  # create cannot be resourceName-scoped; get/update/patch are locked to the one secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["radius-eap-tls"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-pusher
  namespace: freeradius
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-pusher
subjects:
  - kind: ServiceAccount
    name: cert-pusher
    namespace: freeradius
---
# Non-expiring token for the certmonger hook on ipa9 (kubeconfig placed there).
apiVersion: v1
kind: Secret
metadata:
  name: cert-pusher-token
  namespace: freeradius
  annotations:
    kubernetes.io/service-account.name: cert-pusher
type: kubernetes.io/service-account-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freeradius
  namespace: freeradius
  annotations:
    configmap.reloader.stakater.com/reload: "freeradius-raddb,freeradius-init"
    secret.reloader.stakater.com/reload: "radius-eap-tls"
spec:
  replicas: 1
  selector: { matchLabels: { app: freeradius } }
  template:
    metadata:
      labels: { app: freeradius }
    spec:
      initContainers:
        - name: assemble
          image: freeradius/freeradius-server:3.2.7
          command: ["/bin/sh", "/init/assemble.sh"]
          env:
            - name: LDAP_BIND_PASSWORD
              valueFrom: { secretKeyRef: { name: freeradius-secrets, key: ldap_bind_password } }
            - name: RADIUS_SHARED_SECRET
              valueFrom: { secretKeyRef: { name: freeradius-secrets, key: radius_shared_secret } }
          volumeMounts:
            - { name: assembled, mountPath: /assembled }
            - { name: tmpl, mountPath: /tmpl }
            - { name: init, mountPath: /init }
            - { name: eapcert, mountPath: /certs, readOnly: true }
      containers:
        - name: freeradius
          image: freeradius/freeradius-server:3.2.7
          args: ["-f", "-d", "/assembled"]
          ports:
            - { containerPort: 1812, protocol: UDP, name: auth }
            - { containerPort: 1813, protocol: UDP, name: acct }
          volumeMounts:
            - { name: assembled, mountPath: /assembled }
          readinessProbe:
            exec: { command: ["/bin/sh","-c","freeradius -XCd /assembled >/dev/null 2>&1"] }
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - { name: assembled, emptyDir: {} }
        - name: tmpl
          configMap:
            name: freeradius-raddb
            items:
              - { key: clients.conf,   path: clients.conf }
              - { key: mods-ldap,      path: mods-ldap }
              - { key: eap-tls-config, path: eap-tls-config }
              - { key: inner-authorize, path: inner-authorize }
        - { name: init, configMap: { name: freeradius-init } }
        - { name: eapcert, secret: { secretName: radius-eap-tls } }
---
apiVersion: v1
kind: Service
metadata:
  name: freeradius
  namespace: freeradius
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.7.214"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector: { app: freeradius }
  ports:
    - { name: auth, port: 1812, targetPort: 1812, protocol: UDP }
    - { name: acct, port: 1813, targetPort: 1813, protocol: UDP }
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: freeradius
  namespace: freeradius
spec:
  endpointSelector: { matchLabels: { app: freeradius } }
  ingress:
    - fromCIDR: ["192.168.1.0/24", "192.168.2.0/24"]
      toPorts:
        - ports:
            - { port: "1812", protocol: UDP }
            - { port: "1813", protocol: UDP }
  egress:
    - toEndpoints: [{ matchLabels: { "k8s:io.kubernetes.pod.namespace": kube-system, "k8s-app": kube-dns } }]
      toPorts: [{ ports: [{ port: "53", protocol: UDP }] }]
    - toCIDR: ["192.168.1.26/32"]     # ipa9
      toPorts: [{ ports: [{ port: "636", protocol: TCP }] }]
