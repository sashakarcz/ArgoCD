---
apiVersion: v1
kind: Namespace
metadata:
  name: krampus

---
# Create secret before first sync:
# kubectl create secret generic krampus-secrets -n krampus \
#   --from-literal=oidc-client-secret="<from authentik>" \
#   --from-literal=jwt-secret="<from .env>"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: krampus-db
  namespace: krampus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: krampus
  namespace: krampus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: krampus
  template:
    metadata:
      labels:
        app: krampus
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: krampus
        image: astrognome/krampus:latest
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_PATH
          value: /app/database/krampus.db
        - name: SERVER_PORT
          value: "8080"
        - name: OIDC_PROVIDER_URL
          value: https://auth.starnix.net/application/o/krampus/
        - name: OIDC_CLIENT_ID
          value: U6ADIS5YTJ2dZ6LLDo7NiXAFOT7oQdI1p0rbDFsM
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: krampus-secrets
              key: oidc-client-secret
        - name: OIDC_REDIRECT_URL
          value: https://krampus.starnix.net/auth/callback
        - name: OIDC_SCOPES
          value: openid,profile,email
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: krampus-secrets
              key: jwt-secret
        - name: JWT_EXPIRY
          value: 24h
        - name: VOTE_THRESHOLD
          value: "2"
        - name: ADMIN_EMAILS
          value: sasha@starnix.net
        - name: SYNC_BASE_URL
          value: https://krampus.starnix.net
        volumeMounts:
        - name: db
          mountPath: /app/database
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /ping
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ping
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: db
        persistentVolumeClaim:
          claimName: krampus-db

---
apiVersion: v1
kind: Service
metadata:
  name: krampus
  namespace: krampus
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Krampus"
    gethomepage.dev/description: "Santa Sync"
    gethomepage.dev/group: "Tools"
    gethomepage.dev/icon: "https://krampus.starnix.net/favicon.ico"
    gethomepage.dev/href: "https://krampus.starnix.net"
spec:
  selector:
    app: krampus
  ports:
  - port: 80
    targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: krampus-ingress
  namespace: krampus
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - krampus.starnix.net
    secretName: krampus-tls
  rules:
  - host: krampus.starnix.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: krampus
            port:
              number: 80
