# Egress policy. krampus is reached by LAN clients for Santa sync and is itself an OIDC client of auth.starnix.net (Traefik ingress), so it needs the RFC1918 LAN as well as the public internet. Only link-local + CGNAT stay blocked. NFS PVs are node-side and unaffected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: krampus-egress-lockdown
  namespace: krampus
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # DNS to CoreDNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Public internet + all RFC1918 (LAN, cluster, Authentik via Traefik).
    # Only link-local and CGNAT ranges remain excluded.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
              - 100.64.0.0/10
