apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signoz-helm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.signoz.io
    chart: signoz
    targetRevision: 0.111.0
    helm:
      releaseName: signoz
      values: |
        # SigNoz frontend/query service (accessed via Traefik ingress)
        signoz:
          service:
            type: ClusterIP

        # OpenTelemetry Collector
        otelCollector:
          service:
            type: LoadBalancer
            annotations:
              metallb.universe.tf/loadBalancerIPs: "192.168.7.205"
          ports:
            syslog-tcp:
              enabled: true
              containerPort: 8514
              servicePort: 8514
              protocol: TCP
            syslog-udp:
              enabled: true
              containerPort: 8514
              servicePort: 8514
              protocol: UDP
            fluentforward:
              enabled: true
              containerPort: 24224
              servicePort: 24224
              protocol: TCP
          config:
            receivers:
              otlp:
                protocols:
                  grpc:
                    endpoint: 0.0.0.0:4317
                  http:
                    endpoint: 0.0.0.0:4318
              fluentforward:
                endpoint: 0.0.0.0:24224
              syslog:
                tcp:
                  listen_address: 0.0.0.0:8514
                udp:
                  listen_address: 0.0.0.0:8514
                protocol: rfc5424
                operators:
                  - type: move
                    from: attributes.message
                    to: body
            processors:
              filter/drop_grpc_metrics:
                metrics:
                  metric:
                    - 'name == "grpc_server_handled_total"'
              transform/syslog_resources:
                log_statements:
                  - context: log
                    statements:
                      - set(resource.attributes["host.name"], attributes["structured_data"]["resource"]["host.name"]) where resource.attributes["host.name"] == nil
                      - set(resource.attributes["service.name"], attributes["structured_data"]["resource"]["service.name"]) where resource.attributes["service.name"] == nil
            service:
              pipelines:
                logs:
                  receivers: [otlp, fluentforward, syslog]
                  processors: [transform/syslog_resources, batch]
                metrics:
                  processors: [filter/drop_grpc_metrics]

        # ClickHouse storage (NFS-backed PVCs)
        clickhouse:
          persistence:
            enabled: true
            existingClaim: signoz-clickhouse-data
            size: 50Gi
          zookeeper:
            persistence:
              enabled: true
              existingClaim: signoz-zookeeper-data
              size: 5Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: signoz
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
  - group: apps
    kind: Deployment
    name: signoz-clickhouse-operator
    jsonPointers:
    - /spec
  - group: apps
    kind: StatefulSet
    name: signoz
    jsonPointers:
    - /spec
