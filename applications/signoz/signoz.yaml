---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: signoz
  labels:
    name: signoz

---
# ClickHouse Data PV (NFS)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: signoz-clickhouse-data-pv
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.1.75
    path: /mnt/Store/nomad/signoz/clickhouse/data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: signoz-clickhouse-data
  namespace: signoz
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  volumeName: signoz-clickhouse-data-pv
  storageClassName: ""

---
# ClickHouse Logs PV (NFS)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: signoz-clickhouse-logs-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.1.75
    path: /mnt/Store/nomad/signoz/clickhouse/logs

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: signoz-clickhouse-logs
  namespace: signoz
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  volumeName: signoz-clickhouse-logs-pv
  storageClassName: ""

---
# ZooKeeper Data PV (NFS)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: signoz-zookeeper-data-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.1.75
    path: /mnt/Store/nomad/signoz/zookeeper/data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: signoz-zookeeper-data
  namespace: signoz
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  volumeName: signoz-zookeeper-data-pv
  storageClassName: ""

---
# Ingress for SigNoz UI
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: signoz-ingress
  namespace: signoz
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: traefik-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - signoz.starnix.net
    secretName: signoz-tls
  rules:
  - host: signoz.starnix.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: signoz
            port:
              number: 8080
