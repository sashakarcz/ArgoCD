---
apiVersion: v1
kind: Namespace
metadata:
  name: privatebin

---
# Persistent Volume Claim using LONGHORN
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: privatebin-data-pvc
  namespace: privatebin
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: "longhorn"

---
# PrivateBin Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: privatebin
  namespace: privatebin
  labels:
    app: privatebin
spec:
  replicas: 1
  strategy:
    type: Recreate # Required for RWO volumes to swap pods safely
  selector:
    matchLabels:
      app: privatebin
  template:
    metadata:
      labels:
        app: privatebin
    spec:
      # This section fixes the "Permission Denied" error
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000 
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: privatebin
        image: privatebin/nginx-fpm-alpine
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
        volumeMounts:
        - name: privatebin-data-storage
          mountPath: "/srv/data"
      volumes:
      - name: privatebin-data-storage
        persistentVolumeClaim:
          claimName: privatebin-data-pvc

---
# PrivateBin Service
apiVersion: v1
kind: Service
metadata:
  name: privatebin
  namespace: privatebin
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "PrivateBin"
    gethomepage.dev/description: "Encrypted Pastebin"
    gethomepage.dev/group: "Tools"
    gethomepage.dev/icon: "privatebin.png"
    gethomepage.dev/href: "https://privatebin.starnix.net"
spec:
  selector:
    app: privatebin
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP

---
# PrivateBin Ingress for Traefik
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: privatebin-ingress
  namespace: privatebin
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "PrivateBin"
    gethomepage.dev/description: "Encrypted Pastebin"
    gethomepage.dev/group: "Tools"
    gethomepage.dev/icon: "privatebin.png"
    gethomepage.dev/href: "https://privatebin.starnix.net"
    gethomepage.dev/pod-selector: "app=privatebin"
spec:
  ingressClassName: traefik
  rules:
  - host: privatebin.starnix.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: privatebin
            port:
              number: 8080
  tls:
  - hosts:
    - privatebin.starnix.net
    secretName: privatebin-tls-secret
