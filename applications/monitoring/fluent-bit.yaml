apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://fluent.github.io/helm-charts
    chart: fluent-bit
    targetRevision: 0.57.9
    helm:
      releaseName: fluent-bit
      values: |
        # Ships all k8s container logs to Graylog via GELF (replaces promtail + Loki).
        # graylog.starnix.net (192.168.1.151) is EXTERNAL to the cluster, so egress is
        # a normal LAN destination -- ipBlock-friendly, no namespaceSelector needed.
        kind: DaemonSet

        # Node name -> used as the GELF `host` field.
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 192Mi

        # Collect from every node, including control-plane.
        tolerations:
          - operator: Exists

        config:
          service: |
            [SERVICE]
                Daemon        Off
                Flush         5
                Log_Level     info
                Parsers_File  /fluent-bit/etc/parsers.conf
                HTTP_Server   On
                HTTP_Listen   0.0.0.0
                HTTP_Port     2020
                Health_Check  On

          inputs: |
            [INPUT]
                Name              tail
                Path              /var/log/containers/*.log
                multiline.parser  cri
                Tag               kube.*
                Mem_Buf_Limit     50MB
                Skip_Long_Lines   On
                Refresh_Interval  10

          filters: |
            [FILTER]
                Name                kubernetes
                Match               kube.*
                K8S-Logging.Parser  On
                K8S-Logging.Exclude On
            [FILTER]
                Name    modify
                Match   kube.*
                Add     host ${NODE_NAME}
            # Longhorn instance-manager/manager flood info+debug (snapshot-hash spam,
            # ~99% of log volume). Drop just those lines; warning/error still ship.
            [FILTER]
                Name    grep
                Match   kube.*
                Exclude log longhorn-(instance-manager|manager).*level=(info|debug)
            # Fan out ONLY the Authentik + Traefik app containers to a second
            # tag (keep=true, so the original kube.* record still reaches
            # Graylog). The Wazuh syslog output below matches wazuh.k8s.
            [FILTER]
                Name          rewrite_tag
                Match         kube.*
                Rule          $kubernetes['container_name'] ^(authentik-server|authentik-worker|traefik)$ wazuh.k8s true
                Emitter_Name  re_wazuh
            # Stable syslog appname so the manager's k8sjson decoder matches.
            [FILTER]
                Name    modify
                Match   wazuh.k8s
                Add     wazuh_ident k8sjson

          outputs: |
            [OUTPUT]
                Name                   gelf
                Match                  kube.*
                Host                   graylog.starnix.net
                Port                   12201
                Mode                   udp
                Gelf_Short_Message_Key log
                Gelf_Host_Key          host
                Retry_Limit            3
            # Second output: only the re-tagged Authentik/Traefik records to the
            # Wazuh manager syslog input. rfc5424; message = the app JSON log
            # line ('log'), appname 'k8sjson' -> manager k8sjson decoder.
            [OUTPUT]
                Name                syslog
                Match               wazuh.k8s
                Host                192.168.7.220
                Port                514
                Mode                udp
                Syslog_Format       rfc5424
                Syslog_Hostname_Key host
                Syslog_Appname_Key  wazuh_ident
                Syslog_Message_Key  log
                Retry_Limit         2

  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
