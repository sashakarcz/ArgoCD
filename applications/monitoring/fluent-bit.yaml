apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://fluent.github.io/helm-charts
    chart: fluent-bit
    targetRevision: 0.57.9
    helm:
      releaseName: fluent-bit
      values: |
        # Ships all k8s container logs to Graylog via GELF (replaces promtail + Loki).
        # graylog.starnix.net (192.168.1.151) is EXTERNAL to the cluster, so egress is
        # a normal LAN destination -- ipBlock-friendly, no namespaceSelector needed.
        kind: DaemonSet

        # Node name -> used as the GELF `host` field.
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 192Mi

        # Collect from every node, including control-plane.
        tolerations:
          - operator: Exists

        config:
          service: |
            [SERVICE]
                Daemon        Off
                Flush         5
                Log_Level     info
                Parsers_File  /fluent-bit/etc/parsers.conf
                HTTP_Server   On
                HTTP_Listen   0.0.0.0
                HTTP_Port     2020
                Health_Check  On

          inputs: |
            [INPUT]
                Name              tail
                Path              /var/log/containers/*.log
                multiline.parser  cri
                Tag               kube.*
                Mem_Buf_Limit     50MB
                Skip_Long_Lines   On
                Refresh_Interval  10

          filters: |
            [FILTER]
                Name                kubernetes
                Match               kube.*
                K8S-Logging.Parser  On
                K8S-Logging.Exclude On
            [FILTER]
                Name    modify
                Match   kube.*
                Add     host ${NODE_NAME}

          outputs: |
            [OUTPUT]
                Name                   gelf
                Match                  kube.*
                Host                   graylog.starnix.net
                Port                   12201
                Mode                   udp
                Gelf_Short_Message_Key message
                Gelf_Host_Key          host
                Retry_Limit            3

  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
