---
# Static NFS provisioner StorageClass — used by monitoring PVs and other NFS-backed apps (authentik, etc.)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: manual
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: Immediate
reclaimPolicy: Retain
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
# NFS Persistent Volumes
# Before syncing, create these dirs on 192.168.1.75:
#   /mnt/Store/monitoring/prometheus
#   /mnt/Store/monitoring/alertmanager
#   /mnt/Store/monitoring/loki
# and chown -R 1000:2000 prometheus alertmanager  (runAsUser=1000, fsGroup=2000)
# and chown -R 10001:10001 loki                  (runAsUser=10001, fsGroup=10001)
# Grafana uses Longhorn (not NFS) to avoid SQLite locking issues

apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-data-pv
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  mountOptions:
    - noatime
    - rsize=1048576
    - wsize=1048576
    - hard
    - nfsvers=4.1
  claimRef:
    name: prometheus-db-prometheus-monitoring-kube-prometheus-prometheus-0
    namespace: monitoring
  nfs:
    server: 192.168.1.75
    path: /mnt/Store/monitoring/prometheus
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: alertmanager-data-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  claimRef:
    name: alertmanager-db-alertmanager-monitoring-kube-prometheus-alertmanager-0
    namespace: monitoring
  nfs:
    server: 192.168.1.75
    path: /mnt/Store/monitoring/alertmanager
---
# monitoring-secrets: synced from OpenBao secret/cluster/monitoring-secrets via ESO (ClusterSecretStore 'openbao').
# Migrated from a VSO VaultStaticSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monitoring-secrets
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: monitoring-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster/monitoring-secrets
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loki
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: loki.starnix.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loki
                port:
                  number: 3100
  tls:
    - secretName: loki-tls
      hosts:
        - loki.starnix.net
