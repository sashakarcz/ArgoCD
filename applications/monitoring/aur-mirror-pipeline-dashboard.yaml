apiVersion: v1
kind: ConfigMap
metadata:
  name: aur-mirror-pipeline-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  aur-mirror-pipeline.json: |
    {
      "title": "AUR Mirror -- Pipeline",
      "uid": "aur-mirror-pipeline",
      "description": "Live scan/build/sign progress, last-run summary, held packages, and a link to the Graylog build logs.",
      "tags": [
        "aur",
        "security"
      ],
      "timezone": "browser",
      "refresh": "10s",
      "schemaVersion": 39,
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "hide": 0,
            "label": "Datasource",
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Live",
          "id": 1,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "collapsed": false
        },
        {
          "id": 2,
          "title": "Current Stage",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "aur_mirror_active_phase",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "name"
          },
          "fieldConfig": {
            "defaults": {
              "displayName": "${__field.labels.phase}",
              "noValue": "idle",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "scan": {
                      "color": "blue",
                      "index": 0
                    }
                  }
                },
                {
                  "type": "value",
                  "options": {
                    "build": {
                      "color": "orange",
                      "index": 1
                    }
                  }
                },
                {
                  "type": "value",
                  "options": {
                    "sign": {
                      "color": "purple",
                      "index": 2
                    }
                  }
                },
                {
                  "type": "value",
                  "options": {
                    "idle": {
                      "color": "green",
                      "index": 3
                    }
                  }
                }
              ]
            }
          }
        },
        {
          "id": 3,
          "title": "Currently Processing",
          "type": "stat",
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 7,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "aur_mirror_active_package",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "name"
          },
          "fieldConfig": {
            "defaults": {
              "displayName": "${__field.labels.package}",
              "noValue": "-- idle --"
            }
          }
        },
        {
          "id": 4,
          "title": "Progress",
          "type": "gauge",
          "gridPos": {
            "x": 11,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "100 * aur_mirror_progress_current / clamp_min(aur_mirror_progress_total, 1)",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "showThresholdLabels": false
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 100
                  }
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "title": "Package N",
          "type": "stat",
          "gridPos": {
            "x": 15,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "aur_mirror_progress_current",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "0"
            }
          }
        },
        {
          "id": 6,
          "title": "of Total",
          "type": "stat",
          "gridPos": {
            "x": 18,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "aur_mirror_progress_total",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "0"
            }
          }
        },
        {
          "id": 7,
          "title": "Idle (s)",
          "type": "stat",
          "gridPos": {
            "x": 21,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "time() - aur_mirror_activity_timestamp_seconds",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "noValue": "-",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 600
                  },
                  {
                    "color": "red",
                    "value": 1800
                  }
                ]
              }
            }
          }
        },
        {
          "type": "row",
          "title": "Last Run",
          "id": 10,
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 1
          },
          "collapsed": false
        },
        {
          "id": 11,
          "title": "Last Build",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "aur_mirror_last_run_timestamp_seconds * 1000",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "dateTimeAsLocal",
              "noValue": "Never"
            }
          }
        },
        {
          "id": 12,
          "title": "Status",
          "type": "stat",
          "gridPos": {
            "x": 4,
            "y": 6,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "aur_mirror_last_run_success",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Held items",
                      "color": "yellow",
                      "index": 0
                    }
                  }
                },
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "All OK",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ],
              "noValue": "?"
            }
          }
        },
        {
          "id": 13,
          "title": "Approved",
          "type": "stat",
          "gridPos": {
            "x": 8,
            "y": 6,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "aur_mirror_packages_total",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "0"
            }
          }
        },
        {
          "id": 14,
          "title": "Built",
          "type": "stat",
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "aur_mirror_packages_succeeded_total",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "0",
              "color": {
                "mode": "fixed",
                "fixedColor": "green"
              }
            }
          }
        },
        {
          "id": 15,
          "title": "Skipped",
          "type": "stat",
          "gridPos": {
            "x": 16,
            "y": 6,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "aur_mirror_packages_skipped_total",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "0"
            }
          }
        },
        {
          "id": 16,
          "title": "Held",
          "type": "stat",
          "gridPos": {
            "x": 20,
            "y": 6,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "aur_mirror_packages_held_total",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          }
        },
        {
          "type": "row",
          "title": "Held Packages",
          "id": 20,
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 24,
            "h": 1
          },
          "collapsed": false
        },
        {
          "id": 21,
          "title": "Held (keeping last-good build)",
          "type": "table",
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 24,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "aur_mirror_package_held",
              "instant": true,
              "format": "table",
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "exported_job": true
                },
                "renameByName": {
                  "package": "Package",
                  "reason": "Reason",
                  "risk": "Risk",
                  "summary": "Summary"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true
          }
        },
        {
          "type": "row",
          "title": "Logs",
          "id": 30,
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 24,
            "h": 1
          },
          "collapsed": false
        },
        {
          "id": 31,
          "title": "Logs",
          "type": "text",
          "gridPos": {
            "x": 0,
            "y": 19,
            "w": 24,
            "h": 3
          },
          "options": {
            "mode": "markdown",
            "content": "### Build logs\nLive scan / build / sign logs stream to Graylog via fluent-bit (GELF).\n\n**[Open the AUR builder logs in Graylog](https://graylog.starnix.net/search?q=aur-builder&rangetype=relative&relative=3600)** (last hour, full-text `aur-builder`).\n\nRefine with fields, e.g. the pod/container, or the `-- Processing:` lines, and save it as a stream/dashboard in Graylog."
          }
        }
      ]
    }
