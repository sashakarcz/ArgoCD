---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-manager-config
  namespace: wazuh
data:
  ossec.conf: |
    <ossec_config>
      <global>
        <jsonout_output>yes</jsonout_output>
        <alerts_log>yes</alerts_log>
        <logall>no</logall>
        <logall_json>no</logall_json>
        <email_notification>no</email_notification>
        <agents_disconnection_time>10m</agents_disconnection_time>
        <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
      </global>

      <alerts>
        <log_alert_level>3</log_alert_level>
        <email_alert_level>12</email_alert_level>
      </alerts>

      <logging>
        <log_format>plain</log_format>
      </logging>

      <remote>
        <connection>secure</connection>
        <port>1514</port>
        <protocol>tcp</protocol>
        <queue_size>131072</queue_size>
      </remote>

      <remote>
        <connection>syslog</connection>
        <port>514</port>
        <protocol>udp</protocol>
        <allowed-ips>192.168.0.0/16</allowed-ips>
      </remote>

      <rootcheck>
        <disabled>no</disabled>
        <check_files>yes</check_files>
        <check_trojans>yes</check_trojans>
        <check_dev>yes</check_dev>
        <check_sys>yes</check_sys>
        <check_pids>yes</check_pids>
        <check_ports>yes</check_ports>
        <check_if>yes</check_if>
        <frequency>43200</frequency>
        <rootkit_files>etc/rootcheck/rootkit_files.txt</rootkit_files>
        <rootkit_trojans>etc/rootcheck/rootkit_trojans.txt</rootkit_trojans>
        <skip_nfs>yes</skip_nfs>
      </rootcheck>

      <wodle name="syscollector">
        <disabled>no</disabled>
        <interval>1h</interval>
        <scan_on_start>yes</scan_on_start>
        <hardware>yes</hardware>
        <os>yes</os>
        <network>yes</network>
        <packages>yes</packages>
        <ports all="yes">yes</ports>
        <processes>yes</processes>
        <synchronization>
          <max_eps>10</max_eps>
        </synchronization>
      </wodle>

      <sca>
        <enabled>yes</enabled>
        <scan_on_start>yes</scan_on_start>
        <interval>12h</interval>
        <skip_nfs>yes</skip_nfs>
      </sca>

      <vulnerability-detection>
        <enabled>yes</enabled>
        <index-status>yes</index-status>
        <feed-update-interval>60m</feed-update-interval>
      </vulnerability-detection>

      <indexer>
        <enabled>yes</enabled>
        <hosts>
          <host>https://wazuh.indexer:9200</host>
        </hosts>
        <ssl>
          <certificate_authorities>
            <ca>/etc/ssl/root-ca.pem</ca>
          </certificate_authorities>
          <certificate>/etc/ssl/filebeat.pem</certificate>
          <key>/etc/ssl/filebeat-key.pem</key>
        </ssl>
      </indexer>

      <syscheck>
        <disabled>no</disabled>
        <frequency>43200</frequency>
        <scan_on_start>yes</scan_on_start>
        <alert_new_files>yes</alert_new_files>
        <auto_ignore frequency="10" timeframe="3600">no</auto_ignore>
        <directories>/etc,/usr/bin,/usr/sbin</directories>
        <directories>/bin,/sbin,/boot</directories>
        <ignore>/etc/mtab</ignore>
        <ignore>/etc/hosts.deny</ignore>
        <ignore>/etc/adjtime</ignore>
        <ignore type="sregex">.log$|.swp$</ignore>
        <nodiff>/etc/ssl/private.key</nodiff>
        <skip_nfs>yes</skip_nfs>
        <skip_dev>yes</skip_dev>
        <skip_proc>yes</skip_proc>
        <skip_sys>yes</skip_sys>
        <process_priority>10</process_priority>
        <max_eps>100</max_eps>
        <synchronization>
          <enabled>yes</enabled>
          <interval>5m</interval>
          <max_interval>1h</max_interval>
          <max_eps>10</max_eps>
        </synchronization>
      </syscheck>

      <global>
        <white_list>127.0.0.1</white_list>
        <white_list>^localhost.localdomain$</white_list>
      </global>

      <command>
        <name>disable-account</name>
        <executable>disable-account</executable>
        <timeout_allowed>yes</timeout_allowed>
      </command>
      <command>
        <name>restart-wazuh</name>
        <executable>restart-wazuh</executable>
      </command>
      <command>
        <name>firewall-drop</name>
        <executable>firewall-drop</executable>
        <timeout_allowed>yes</timeout_allowed>
      </command>

      <localfile>
        <log_format>command</log_format>
        <command>df -P</command>
        <frequency>360</frequency>
      </localfile>
      <localfile>
        <log_format>full_command</log_format>
        <command>last -n 20</command>
        <frequency>360</frequency>
      </localfile>

      <ruleset>
        <decoder_dir>ruleset/decoders</decoder_dir>
        <rule_dir>ruleset/rules</rule_dir>
        <rule_exclude>0215-policy_rules.xml</rule_exclude>
        <list>etc/lists/audit-keys</list>
        <list>etc/lists/amazon/aws-eventnames</list>
        <list>etc/lists/security-eventchannel</list>
        <decoder_dir>etc/decoders</decoder_dir>
        <rule_dir>etc/rules</rule_dir>
      </ruleset>

      <rule_test>
        <enabled>yes</enabled>
        <threads>1</threads>
        <max_sessions>64</max_sessions>
        <session_timeout>15m</session_timeout>
      </rule_test>

      <auth>
        <disabled>no</disabled>
        <port>1515</port>
        <use_source_ip>no</use_source_ip>
        <purge>yes</purge>
        <use_password>no</use_password>
        <ciphers>HIGH:!ADH:!EXP:!MD5:!RC4:!3DES:!CAMELLIA:@STRENGTH</ciphers>
        <ssl_verify_host>no</ssl_verify_host>
        <ssl_manager_cert>etc/sslmanager.cert</ssl_manager_cert>
        <ssl_manager_key>etc/sslmanager.key</ssl_manager_key>
        <ssl_auto_negotiate>no</ssl_auto_negotiate>
      </auth>

      <cluster>
        <name>wazuh</name>
        <node_name>node01</node_name>
        <node_type>master</node_type>
        <key>aa093264ef885029653eea20dfcf51ae</key>
        <port>1516</port>
        <bind_addr>0.0.0.0</bind_addr>
        <nodes>
          <node>wazuh.manager</node>
        </nodes>
        <hidden>no</hidden>
        <disabled>yes</disabled>
      </cluster>
    </ossec_config>

    <ossec_config>
      <localfile>
        <log_format>syslog</log_format>
        <location>/var/ossec/logs/active-responses.log</location>
      </localfile>
    </ossec_config>

---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-manager
  namespace: wazuh
spec:
  selector:
    app: wazuh-manager
  ports:
  - name: api
    port: 55000
    targetPort: 55000

---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-manager-lb
  namespace: wazuh
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.7.220
spec:
  type: LoadBalancer
  selector:
    app: wazuh-manager
  ports:
  - name: agent
    port: 1514
    targetPort: 1514
    protocol: TCP
  - name: enrollment
    port: 1515
    targetPort: 1515
    protocol: TCP
  - name: syslog
    port: 514
    targetPort: 514
    protocol: UDP
  - name: api
    port: 55000
    targetPort: 55000
    protocol: TCP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager
  namespace: wazuh
spec:
  serviceName: wazuh-manager
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-manager
  template:
    metadata:
      labels:
        app: wazuh-manager
    spec:
      containers:
      - name: wazuh-manager
        image: wazuh/wazuh-manager:4.14.1
        ports:
        - containerPort: 1514
        - containerPort: 1515
        - containerPort: 514
          protocol: UDP
        - containerPort: 55000
        env:
        - name: INDEXER_URL
          value: "https://wazuh.indexer:9200"
        - name: INDEXER_USERNAME
          value: "admin"
        - name: INDEXER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wazuh-secrets
              key: INDEXER_PASSWORD
        - name: FILEBEAT_SSL_VERIFICATION_MODE
          value: "full"
        - name: SSL_CERTIFICATE_AUTHORITIES
          value: /etc/ssl/root-ca.pem
        - name: SSL_CERTIFICATE
          value: /etc/ssl/filebeat.pem
        - name: SSL_KEY
          value: /etc/ssl/filebeat-key.pem
        - name: API_USERNAME
          value: "wazuh-wui"
        - name: API_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wazuh-secrets
              key: API_PASSWORD
        volumeMounts:
        - name: wazuh-config
          mountPath: /wazuh-config-mount/etc/ossec.conf
          subPath: ossec.conf
        - name: certs
          mountPath: /etc/ssl/root-ca.pem
          subPath: root-ca.pem
        - name: certs
          mountPath: /etc/ssl/filebeat.pem
          subPath: filebeat.pem
        - name: certs
          mountPath: /etc/ssl/filebeat-key.pem
          subPath: filebeat-key.pem
        - name: wazuh-api-configuration
          mountPath: /var/ossec/api/configuration
        - name: wazuh-etc
          mountPath: /var/ossec/etc
        - name: wazuh-logs
          mountPath: /var/ossec/logs
        - name: wazuh-queue
          mountPath: /var/ossec/queue
        - name: wazuh-var-multigroups
          mountPath: /var/ossec/var/multigroups
        - name: wazuh-integrations
          mountPath: /var/ossec/integrations
        - name: wazuh-active-response
          mountPath: /var/ossec/active-response/bin
        - name: wazuh-agentless
          mountPath: /var/ossec/agentless
        - name: wazuh-wodles
          mountPath: /var/ossec/wodles
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
      volumes:
      - name: wazuh-config
        configMap:
          name: wazuh-manager-config
      - name: certs
        secret:
          secretName: wazuh-certs
          items:
          - key: root-ca.pem
            path: root-ca.pem
          - key: filebeat.pem
            path: filebeat.pem
          - key: filebeat-key.pem
            path: filebeat-key.pem
      - name: wazuh-api-configuration
        persistentVolumeClaim:
          claimName: wazuh-manager-api-configuration
      - name: wazuh-etc
        persistentVolumeClaim:
          claimName: wazuh-manager-etc
      - name: wazuh-logs
        persistentVolumeClaim:
          claimName: wazuh-manager-logs
      - name: wazuh-queue
        persistentVolumeClaim:
          claimName: wazuh-manager-queue
      - name: wazuh-var-multigroups
        persistentVolumeClaim:
          claimName: wazuh-manager-var-multigroups
      - name: wazuh-integrations
        persistentVolumeClaim:
          claimName: wazuh-manager-integrations
      - name: wazuh-active-response
        persistentVolumeClaim:
          claimName: wazuh-manager-active-response
      - name: wazuh-agentless
        persistentVolumeClaim:
          claimName: wazuh-manager-agentless
      - name: wazuh-wodles
        persistentVolumeClaim:
          claimName: wazuh-manager-wodles
