<agent_config>

  <!-- Falco runtime-security events (modern eBPF) are written by the Falco
       DaemonSet to a per-node hostPath; the containerized wazuh-agent-falco
       DaemonSet (this "falco" group) tails the JSON and ships it to the manager.
       Manager rules 100600-100603 (local_rules.xml) map Falco priority -> level.
       No syscheck/syscollector here: this agent monitors Falco output, not a host. -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/falco/events.json</location>
  </localfile>

</agent_config>
