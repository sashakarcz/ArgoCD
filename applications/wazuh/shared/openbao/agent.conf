<!--
  openbao group (ADDITIVE): OpenBao/Vault host vault.starnix.net only.

  The vault agent is a member of BOTH 'debian' (base OS config) and 'openbao'
  (this file); Wazuh merges group configs. This is kept OUT of the shared
  'debian' group on purpose: /var/log/vault_audit.log exists only on the vault
  host, so putting it in 'debian' would make bork/hecate log a file-not-found
  ERROR every scan and flood the Graylog error stream.

  SOURCE OF TRUTH MIRROR: this file must be kept in sync with the 'openbao.conf'
  key in wazuh-agent-groups.yaml (content = this file indented +4). The manager
  seeds only the ConfigMap; editing this file alone does nothing.
-->
<agent_config>
  <!-- OpenBao file audit device: one HMAC'd JSON object per line (cleartext
       keys, only sensitive VALUES are HMAC'd). log_format json flattens every
       field into data.* for the rules (ids 100650-100655 in local_rules.xml). -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/vault_audit.log</location>
  </localfile>
</agent_config>
