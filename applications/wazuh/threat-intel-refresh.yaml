---
# Daily threat-intel refresh: pulls individual-IP blocklists (CINS Army,
# blocklist.de, abuse.ch Feodo), writes /var/ossec/etc/lists/malicious-ioc/
# malicious-ip on the manager, and rolls the manager so analysisd recompiles +
# loads the .cdb. The etc PVC is RWO (bound to the manager), so the write goes
# through `kubectl exec`; the reload is a clean `rollout restart` (exec-ing
# wazuh-control restart hangs the exec stream). Feeds are exact-match individual
# IPs because the stock rules 99901-99920 look them up with CDB match_key.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wazuh-threatintel
  namespace: wazuh
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wazuh-threatintel
  namespace: wazuh
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wazuh-threatintel
  namespace: wazuh
subjects:
  - kind: ServiceAccount
    name: wazuh-threatintel
    namespace: wazuh
roleRef:
  kind: Role
  name: wazuh-threatintel
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wazuh-threat-intel-refresh
  namespace: wazuh
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: wazuh-threatintel
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 100          # curl_user in curlimages/curl
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresh
              image: curlimages/curl:8.11.1
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  KREL=$(curl -sfL https://dl.k8s.io/release/stable.txt)
                  curl -sfLo /tmp/kubectl "https://dl.k8s.io/release/${KREL}/bin/linux/amd64/kubectl"
                  chmod +x /tmp/kubectl
                  : > /tmp/ips
                  for u in \
                    "https://cinsscore.com/list/ci-badguys.txt" \
                    "https://lists.blocklist.de/lists/all.txt" \
                    "https://feodotracker.abuse.ch/downloads/ipblocklist.txt"; do
                    curl -sfL --max-time 60 "$u" >> /tmp/ips || echo "WARN: fetch failed: $u"
                  done
                  # leading individual IPv4 per line, deduped (CDB match_key = exact)
                  grep -oE '^[0-9]{1,3}(\.[0-9]{1,3}){3}' /tmp/ips | sort -u > /tmp/clean
                  COUNT=$(wc -l < /tmp/clean)
                  echo "prepared $COUNT malicious IPs"
                  if [ "$COUNT" -lt 100 ]; then echo "ERROR: too few IPs ($COUNT), aborting"; exit 1; fi
                  sed 's/$/:/' /tmp/clean > /tmp/malicious-ip
                  # write the list onto the manager's RWO etc PVC, recompile .cdb
                  /tmp/kubectl exec -n wazuh wazuh-manager-0 -c wazuh-manager -i -- \
                    sh -c 'cat > /var/ossec/etc/lists/malicious-ioc/malicious-ip && /var/ossec/bin/wazuh-makelists >/dev/null 2>&1 || true' < /tmp/malicious-ip
                  # Daemon reload (NOT a pod restart -- the manager image restores
                  # the baked etc/lists on pod start, which would revert the write).
                  echo "list written ($COUNT IPs); reloading manager config (~90s)"
                  /tmp/kubectl exec -n wazuh wazuh-manager-0 -c wazuh-manager -- \
                    /var/ossec/bin/wazuh-control reload >/dev/null 2>&1 || echo "reload nonzero (may still apply)"
                  echo "threat-intel refresh complete"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
