---
apiVersion: v1
kind: Namespace
metadata:
  name: wazuh
---
# wazuh-certs: synced from OpenBao secret/cluster/wazuh-certs via ESO (ClusterSecretStore 'openbao').
# Migrated from a VSO VaultStaticSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wazuh-certs
  namespace: wazuh
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: wazuh-certs
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster/wazuh-certs
---
# wazuh-secrets: synced from OpenBao secret/cluster/wazuh-secrets via ESO (ClusterSecretStore 'openbao').
# Migrated from a VSO VaultStaticSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wazuh-secrets
  namespace: wazuh
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: wazuh-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster/wazuh-secrets
