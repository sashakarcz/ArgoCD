---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-dashboard-config
  namespace: wazuh
data:
  opensearch_dashboards.yml: |
    server.host: 0.0.0.0
    server.port: 5601
    opensearch.hosts: https://wazuh-indexer:9200
    opensearch.username: kibanaserver
    opensearch.password: "${KIBANASERVER_PASSWORD}"
    opensearch.ssl.verificationMode: certificate
    opensearch.requestHeadersWhitelist: ["securitytenant","Authorization"]
    opensearch_security.multitenancy.enabled: false
    opensearch_security.readonly_mode.roles: ["kibana_read_only"]
    server.ssl.enabled: true
    server.ssl.key: "/usr/share/wazuh-dashboard/certs/wazuh.dashboard-key.pem"
    server.ssl.certificate: "/usr/share/wazuh-dashboard/certs/wazuh.dashboard.pem"
    opensearch.ssl.certificateAuthorities: ["/usr/share/wazuh-dashboard/certs/root-ca.pem"]
    uiSettings.overrides.defaultRoute: /app/wz-home
    opensearch_security.cookie.ttl: 900000
    opensearch_security.session.ttl: 900000
    opensearch_security.session.keepalive: true
    opensearch_security.auth.type: "openid"
    opensearch_security.openid.connect_url: "https://auth.starnix.net/application/o/wazuh/.well-known/openid-configuration"
    opensearch_security.openid.client_id: "${OIDC_CLIENT_ID}"
    opensearch_security.openid.client_secret: "${OIDC_CLIENT_SECRET}"
    opensearch_security.openid.base_redirect_url: "https://wazuh-dash.starnix.net"
    opensearch_security.openid.verify_hostnames: false

  wazuh.yml: |
    hosts:
      - default:
          url: "https://wazuh-manager"
          port: 55000
          username: wazuh-wui
          run_as: false

---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-dashboard
  namespace: wazuh
spec:
  selector:
    app: wazuh-dashboard
  ports:
  - port: 5601
    targetPort: 5601

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wazuh-dashboard
  namespace: wazuh
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: wazuh-dashboard-transport@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - wazuh-dash.starnix.net
    secretName: wazuh-dashboard-tls
  rules:
  - host: wazuh-dash.starnix.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wazuh-dashboard
            port:
              number: 5601

---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: wazuh-dashboard-transport
  namespace: wazuh
spec:
  insecureSkipVerify: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-dashboard
  namespace: wazuh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-dashboard
  template:
    metadata:
      labels:
        app: wazuh-dashboard
    spec:
      initContainers:
      - name: render-config
        image: busybox
        command:
        - sh
        - -c
        - |
          sed "s|\${OIDC_CLIENT_ID}|${OIDC_CLIENT_ID}|g; s|\${OIDC_CLIENT_SECRET}|${OIDC_CLIENT_SECRET}|g; s|\${KIBANASERVER_PASSWORD}|${KIBANASERVER_PASSWORD}|g" \
            /config-template/opensearch_dashboards.yml > /rendered-config/opensearch_dashboards.yml
        env:
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: wazuh-secrets
              key: OIDC_CLIENT_ID
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: wazuh-secrets
              key: OIDC_CLIENT_SECRET
        - name: KIBANASERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wazuh-secrets
              key: KIBANASERVER_PASSWORD
        volumeMounts:
        - name: config
          mountPath: /config-template
        - name: rendered-config
          mountPath: /rendered-config
      containers:
      - name: wazuh-dashboard
        image: wazuh/wazuh-dashboard:4.14.1
        ports:
        - containerPort: 5601
        env:
        - name: INDEXER_USERNAME
          value: "admin"
        - name: INDEXER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wazuh-secrets
              key: INDEXER_PASSWORD
        - name: WAZUH_API_URL
          value: "https://wazuh-manager"
        - name: DASHBOARD_USERNAME
          value: "kibanaserver"
        - name: DASHBOARD_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wazuh-secrets
              key: KIBANASERVER_PASSWORD
        - name: API_USERNAME
          value: "wazuh-wui"
        - name: API_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wazuh-secrets
              key: API_PASSWORD
        - name: OPENSEARCH_DASHBOARDS_SERVER_KEY
          value: /usr/share/wazuh-dashboard/certs/wazuh.dashboard-key.pem
        - name: OPENSEARCH_DASHBOARDS_SERVER_CERT
          value: /usr/share/wazuh-dashboard/certs/wazuh.dashboard.pem
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: wazuh-secrets
              key: OIDC_CLIENT_ID
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: wazuh-secrets
              key: OIDC_CLIENT_SECRET
        volumeMounts:
        - name: rendered-config
          mountPath: /usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
          subPath: opensearch_dashboards.yml
        - name: wazuh-config
          mountPath: /usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
          subPath: wazuh.yml
        - name: certs
          mountPath: /usr/share/wazuh-dashboard/certs/root-ca.pem
          subPath: root-ca.pem
        - name: certs
          mountPath: /usr/share/wazuh-dashboard/certs/wazuh.dashboard.pem
          subPath: wazuh.dashboard.pem
        - name: certs
          mountPath: /usr/share/wazuh-dashboard/certs/wazuh.dashboard-key.pem
          subPath: wazuh.dashboard-key.pem
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      volumes:
      - name: config
        configMap:
          name: wazuh-dashboard-config
          items:
          - key: opensearch_dashboards.yml
            path: opensearch_dashboards.yml
      - name: rendered-config
        emptyDir: {}
      - name: wazuh-config
        configMap:
          name: wazuh-dashboard-config
          items:
          - key: wazuh.yml
            path: wazuh.yml
      - name: certs
        secret:
          secretName: wazuh-certs
          items:
          - key: root-ca.pem
            path: root-ca.pem
          - key: wazuh.dashboard.pem
            path: wazuh.dashboard.pem
          - key: wazuh.dashboard-key.pem
            path: wazuh.dashboard-key.pem
