---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-dashboard-config
  namespace: wazuh
data:
  opensearch_dashboards.yml: |
    server.host: 0.0.0.0
    server.port: 5601
    opensearch.hosts: https://wazuh-indexer:9200
    opensearch.username: kibanaserver
    opensearch.password: "${KIBANASERVER_PASSWORD}"
    opensearch.ssl.verificationMode: certificate
    opensearch.requestHeadersWhitelist: ["securitytenant","Authorization"]
    opensearch_security.multitenancy.enabled: false
    opensearch_security.readonly_mode.roles: ["kibana_read_only"]
    server.ssl.enabled: false
    opensearch.ssl.certificateAuthorities: ["/usr/share/wazuh-dashboard/certs/root-ca.pem"]
    uiSettings.overrides.defaultRoute: /app/wz-home
    opensearch_security.cookie.ttl: 900000
    opensearch_security.session.ttl: 900000
    opensearch_security.session.keepalive: true
    opensearch_security.auth.type: "saml"
    server.xsrf.allowlist: ["/_opendistro/_security/saml/acs/idpinitiated", "/_opendistro/_security/saml/acs", "/_opendistro/_security/saml/logout"]

  wazuh.yml: |
    hosts:
      - default:
          url: "https://wazuh-manager"
          port: 55000
          username: wazuh-wui
          password: "${API_PASSWORD}"
          run_as: false

---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-dashboard
  namespace: wazuh
spec:
  selector:
    app: wazuh-dashboard
  ports:
  - port: 5601
    targetPort: 5601

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wazuh-dashboard
  namespace: wazuh
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - wazuh-dash.starnix.net
    secretName: wazuh-dashboard-tls
  rules:
  - host: wazuh-dash.starnix.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wazuh-dashboard
            port:
              number: 5601

---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: wazuh-dashboard-transport
  namespace: wazuh
spec:
  insecureSkipVerify: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-dashboard
  namespace: wazuh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-dashboard
  template:
    metadata:
      labels:
        app: wazuh-dashboard
    spec:
      initContainers:
      - name: render-config
        image: busybox
        command:
        - sh
        - -c
        - |
          sed "s|\${KIBANASERVER_PASSWORD}|${KIBANASERVER_PASSWORD}|g" \
            /config-template/opensearch_dashboards.yml > /rendered-config/opensearch_dashboards.yml
        env:
        - name: KIBANASERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wazuh-secrets
              key: KIBANASERVER_PASSWORD
        volumeMounts:
        - name: config
          mountPath: /config-template
        - name: rendered-config
          mountPath: /rendered-config
      containers:
      - name: wazuh-dashboard
        image: wazuh/wazuh-dashboard:4.14.1
        ports:
        - containerPort: 5601
        env:
        - name: INDEXER_USERNAME
          value: "admin"
        - name: INDEXER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wazuh-secrets
              key: INDEXER_PASSWORD
        - name: WAZUH_API_URL
          value: "https://wazuh-manager"
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
        - name: DASHBOARD_USERNAME
          value: "kibanaserver"
        - name: DASHBOARD_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wazuh-secrets
              key: KIBANASERVER_PASSWORD
        - name: API_USERNAME
          value: "wazuh-wui"
        - name: API_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wazuh-secrets
              key: API_PASSWORD
        volumeMounts:
        - name: rendered-config
          mountPath: /usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
          subPath: opensearch_dashboards.yml
        - name: certs
          mountPath: /usr/share/wazuh-dashboard/certs/root-ca.pem
          subPath: root-ca.pem
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      volumes:
      - name: config
        configMap:
          name: wazuh-dashboard-config
          items:
          - key: opensearch_dashboards.yml
            path: opensearch_dashboards.yml
      - name: rendered-config
        emptyDir: {}
      - name: certs
        secret:
          secretName: wazuh-certs
          items:
          - key: root-ca.pem
            path: root-ca.pem
