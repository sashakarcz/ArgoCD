---
apiVersion: v1
kind: Namespace
metadata:
  name: say-time

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: say-time

---
# say-time-config: config.yaml synced from OpenBao secret/cluster/say-time via
# ESO (ClusterSecretStore 'openbao'). Replaces the VSO VaultAuth+VaultStaticSecret.
# OpenBao path secret/cluster/say-time must contain: config.yaml (full say_time config).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: say-time-config
  namespace: say-time
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: say-time-config
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster/say-time

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: say-time
  namespace: say-time
  labels:
    app: say-time
spec:
  # One replica only — a second instance would fight over the SIP registration on 3CX.
  replicas: 0
  selector:
    matchLabels:
      app: say-time
  template:
    metadata:
      labels:
        app: say-time
    spec:
      # hostNetwork is required: RTP ports must be reachable on the node's real IP
      # so 3CX can route media back. Without it, k8s NATs the source port and audio breaks.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: say-time
          image: registry.starnix.net/library/say_time:latest
          imagePullPolicy: Always
          args: ["-config", "/etc/say_time/config.yaml"]
          ports:
            - name: sip
              containerPort: 5060
              protocol: UDP
            - name: health
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/say_time
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 45
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1Gi
      volumes:
        - name: config
          secret:
            secretName: say-time-config
