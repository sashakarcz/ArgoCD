---
apiVersion: v1
kind: Namespace
metadata:
  name: call-weather
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: call-weather
---
# call-weather-config: synced from OpenBao secret/cluster/call-weather via ESO (ClusterSecretStore 'openbao').
# Migrated from a VSO VaultStaticSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: call-weather-config
  namespace: call-weather
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: call-weather-config
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster/call-weather
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: call-weather
  namespace: call-weather
  labels:
    app: call-weather
spec:
  # One replica only — a second instance would fight over the SIP registration on 3CX.
  replicas: 0
  selector:
    matchLabels:
      app: call-weather
  template:
    metadata:
      labels:
        app: call-weather
    spec:
      # hostNetwork is required: RTP ports must be reachable on the node's real IP
      # so 3CX can route media back. Without it, k8s NATs the source port and audio breaks.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Pin to the node whose SIP ALG pinhole is established (same node as say_time).
      # This ensures the SIP ALG maps our Contact to 192.168.7.101:5060, the same
      # stable external port (5061) that say_time proved works for inbound INVITEs.
      nodeSelector:
        kubernetes.io/hostname: talos-dg8-q1t
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: call-weather
          image: registry.starnix.net/library/call_weather:latest
          imagePullPolicy: Always
          args: ["-config", "/etc/call_weather/config.yaml"]
          ports:
            - name: sip
              containerPort: 5060
              protocol: UDP
            - name: health
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/call_weather
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 45
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1Gi
      volumes:
        - name: config
          secret:
            secretName: call-weather-config
