---
apiVersion: v1
kind: Namespace
metadata:
  name: proxmox

---
# Headless-ish Service with NO selector: endpoints are supplied by the readiness
# updater (proxmox-healthcheck.yaml), pointing at the 5 Proxmox cluster nodes'
# web UIs (bare-metal hosts, not pods).
apiVersion: v1
kind: Service
metadata:
  name: pve-cluster
  namespace: proxmox
spec:
  ports:
    - name: https
      port: 8006
      targetPort: 8006
      protocol: TCP

# NOTE: the EndpointSlice for this Service (the 5 PVE node IPs) is owned and
# health-maintained by the readiness updater in proxmox-healthcheck.yaml, not
# defined statically here -- so a dead node is dropped from rotation and ArgoCD
# doesn't fight the updater's readiness flips.

---
# Proxmox serves its own self-signed cert on 8006 -- skip backend TLS verify.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: pve-transport
  namespace: proxmox
spec:
  insecureSkipVerify: true

---
# Standard Ingress (not a Traefik IngressRoute CRD) so ExternalDNS -- which
# watches source=ingress -- creates the pve.starnix.net record automatically.
# Traefik annotations provide the same behavior the IngressRoute had:
#   - HTTPS to the Proxmox backend (self-signed, via the ServersTransport above)
#   - sticky cookie so a session pins to one node (stable noVNC/xterm console)
#   - websockets are handled automatically by Traefik
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pve
  namespace: proxmox
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: proxmox-pve-transport@kubernetescrd
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: pve_lb
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - pve.starnix.net
      secretName: pve-tls
  rules:
    - host: pve.starnix.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pve-cluster
                port:
                  number: 8006
