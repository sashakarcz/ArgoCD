---
apiVersion: v1
kind: Namespace
metadata:
  name: proxmox

---
# Headless-ish Service with NO selector: endpoints are supplied by the readiness
# updater (proxmox-healthcheck.yaml), pointing at the 5 Proxmox cluster nodes'
# web UIs (bare-metal hosts, not pods).
apiVersion: v1
kind: Service
metadata:
  name: pve-cluster
  namespace: proxmox
  # Homepage tile + Proxmox widget are defined statically in the homepage
  # services.yaml (needs the API token via {{HOMEPAGE_VAR_PROXMOX_PASSWORD}}),
  # so no gethomepage.dev annotations here -- avoids a duplicate tile.
spec:
  ports:
    - name: https
      port: 8006
      targetPort: 8006
      protocol: TCP

# NOTE: the EndpointSlice for this Service (the 5 PVE node IPs) is owned and
# health-maintained by the readiness updater in proxmox-healthcheck.yaml.

---
# Proxmox serves its own self-signed cert on 8006 -- skip backend TLS verify.
# Referenced by the IngressRoute below (same kubernetescrd provider, so the
# reference resolves -- a standard Ingress annotation can't cross providers).
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: pve-transport
  namespace: proxmox
spec:
  insecureSkipVerify: true

---
# Public cert for pve.starnix.net (IngressRoutes aren't watched by cert-manager's
# ingress-shim, so the Certificate is declared explicitly).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pve-tls
  namespace: proxmox
spec:
  secretName: pve-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - pve.starnix.net

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pve
  namespace: proxmox
  annotations:
    # IngressRoutes have no loadBalancer status, so ExternalDNS (traefik-proxy
    # source) needs the target spelled out -- the Traefik LB IP.
    external-dns.alpha.kubernetes.io/target: "192.168.7.207"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pve.starnix.net`)
      kind: Rule
      services:
        - name: pve-cluster
          port: 8006
          scheme: https            # talk HTTPS to Proxmox :8006
          serversTransport: pve-transport
          # Pin a browser session to one node for a stable noVNC/xterm console.
          sticky:
            cookie:
              name: pve_lb
              secure: true
              httpOnly: true
  tls:
    secretName: pve-tls
