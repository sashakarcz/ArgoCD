---
apiVersion: v1
kind: Namespace
metadata:
  name: proxmox

---
# Headless-ish Service with NO selector: endpoints are supplied manually below,
# pointing at the 5 Proxmox cluster nodes' web UIs (bare-metal hosts, not pods).
apiVersion: v1
kind: Service
metadata:
  name: pve-cluster
  namespace: proxmox
spec:
  ports:
    - name: https
      port: 8006
      targetPort: 8006
      protocol: TCP

---
# NOTE: the EndpointSlice for this Service (the 5 PVE node IPs) is owned and
# health-maintained by the readiness updater in proxmox-healthcheck.yaml, not
# defined statically here -- so a dead node is dropped from rotation and ArgoCD
# doesn't fight the updater's readiness flips.


# Proxmox serves its own self-signed cert on 8006 -- skip backend TLS verify.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: pve-transport
  namespace: proxmox
spec:
  insecureSkipVerify: true

---
# Public cert for pve.starnix.net (Traefik front side). The tunnel reaches
# Traefik with noTLSVerify anyway, but a real cert keeps things clean.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pve-tls
  namespace: proxmox
spec:
  secretName: pve-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - pve.starnix.net

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pve
  namespace: proxmox
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pve.starnix.net`)
      kind: Rule
      services:
        - name: pve-cluster
          port: 8006
          scheme: https            # talk HTTPS to Proxmox :8006
          serversTransport: pve-transport
          # Pin a browser session to one node: the auth ticket + noVNC/xterm
          # websocket should land on the same node for a stable console.
          # (Traefik can't actively health-check manual endpoints -- only
          # ExternalName services -- so a separate readiness updater handles HA;
          # see proxmox-healthcheck.yaml.)
          sticky:
            cookie:
              name: pve_lb
              secure: true
              httpOnly: true
  tls:
    secretName: pve-tls
