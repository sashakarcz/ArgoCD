---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: openproject

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: default
  namespace: openproject
spec:
  method: jwt
  mount: kubernetes
  jwt:
    role: cluster
    serviceAccount: vault-auth
    audiences:
      - vault

---
# Vault secret must contain:
#   clientId              - Authentik OIDC client ID for OpenProject
#   clientSecret          - Authentik OIDC client secret for OpenProject
#   postgres-password     - PostgreSQL superuser (postgres) password
#   password              - OpenProject database user password
#   adminPassword         - Initial OpenProject admin user password
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: openproject-secrets
  namespace: openproject
spec:
  type: kv-v2
  mount: secret
  path: cluster/openproject-secrets
  vaultAuthRef: default
  destination:
    name: openproject-secrets
    create: true
  refreshAfter: 1h
