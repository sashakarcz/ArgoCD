---
# 1. Namespace
# A dedicated namespace for Jellyfin resources.
apiVersion: v1
kind: Namespace
metadata:
  name: jellyfin
  labels:
    name: jellyfin

---
# 2. PersistentVolumes (NFS)
# Defines all the NFS volumes for Jellyfin's configuration and media libraries.
# --------------------------------------------------------------------------

# Config Volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-config-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: "192.168.1.75"
    path: "/mnt/Store/nomad/jellyfin/config"

---
# Jellyfin config on Longhorn (3 replicas, RWO, dynamically provisioned).
# Restored from tar backup on 2026-06-14 after jellyfin-config-restored
# volume entered a persistent degraded state (all replicas healthy=False).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config-longhorn-pvc
  namespace: jellyfin
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi

---
# Series Volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-series-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: "192.168.1.86"
    path: "/media/completed/Series"

---
# Movies Volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-movies-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: "192.168.1.86"
    path: "/media/completed/Movies"

---
# Old TV Volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-old-tv-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: "192.168.1.75"
    path: "/mnt/Store/Videos/torrents/TV"

---
# Old Movies Volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-old-movies-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: "192.168.1.75"
    path: "/mnt/Store/Videos/torrents/Movies"

---
# Music Volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-music-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: "192.168.1.75"
    path: "/mnt/Store/Music"

---
# New Music Volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-new-music-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: "192.168.1.86"
    path: "/media/completed/Music"

---
# 3. PersistentVolumeClaims
# Claims for each of the NFS volumes.
# --------------------------------------------------------------------------

# Config Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config-pvc
  namespace: jellyfin
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  volumeName: jellyfin-config-pv
  storageClassName: ""

---
# Series Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-series-pvc
  namespace: jellyfin
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  volumeName: jellyfin-series-pv
  storageClassName: ""

---
# Movies Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-movies-pvc
  namespace: jellyfin
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  volumeName: jellyfin-movies-pv
  storageClassName: ""

---
# Old TV Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-old-tv-pvc
  namespace: jellyfin
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  volumeName: jellyfin-old-tv-pv
  storageClassName: ""

---
# Old Movies Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-old-movies-pvc
  namespace: jellyfin
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  volumeName: jellyfin-old-movies-pv
  storageClassName: ""

---
# Music Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-music-pvc
  namespace: jellyfin
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  volumeName: jellyfin-music-pv
  storageClassName: ""

---
# New Music Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-new-music-pvc
  namespace: jellyfin
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  volumeName: jellyfin-new-music-pv
  storageClassName: ""

---
# 4. Deployment
# Manages the Jellyfin application pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # Pod-level security context
      securityContext:
        fsGroup: 105
        supplementalGroups: [44, 105]
      hostNetwork: false
      dnsPolicy: ClusterFirst
      containers:
      - name: jellyfin
        image: jellyfin/jellyfin
        ports:
        - containerPort: 8096
          name: http
        env:
        - name: JELLYFIN_DATA_DIR
          value: "/config/data"
        - name: JELLYFIN_TEMP_DIR
          value: "/transcode"
        - name: LIBVA_DRIVER_NAME
          value: "iHD"
        # Container-level security context
        securityContext:
          privileged: true
        resources:
          limits:
            cpu: 12000m
            memory: 12Gi
          requests:
            cpu: 200m
            memory: 4Gi
          # GPU temporarily disabled - no Intel i915 GPU available on cluster nodes
          # Uncomment when GPU nodes are available:
          # limits:
          #   gpu.intel.com/i915: 1
        volumeMounts:
        - name: scratch-volume
          mountPath: "/transcode"
        - name: config-volume
          mountPath: "/config"
        - name: series-volume
          mountPath: "/tv"
        - name: movies-volume
          mountPath: "/movies"
        - name: old-tv-volume
          mountPath: "/old/tv"
        - name: old-movies-volume
          mountPath: "/old/movies"
        - name: music-volume
          mountPath: "/Music"
        - name: new-music-volume
          mountPath: "/new/Music"
        - name: dev-dri
          mountPath: /dev/dri
      volumes:
      - name: scratch-volume
        emptyDir:
          medium: Memory
          sizeLimit: 20Gi
      - name: config-volume
        persistentVolumeClaim:
          claimName: jellyfin-config-longhorn-pvc
      - name: series-volume
        persistentVolumeClaim:
          claimName: jellyfin-series-pvc
      - name: movies-volume
        persistentVolumeClaim:
          claimName: jellyfin-movies-pvc
      - name: old-tv-volume
        persistentVolumeClaim:
          claimName: jellyfin-old-tv-pvc
      - name: old-movies-volume
        persistentVolumeClaim:
          claimName: jellyfin-old-movies-pvc
      - name: music-volume
        persistentVolumeClaim:
          claimName: jellyfin-music-pvc
      - name: new-music-volume
        persistentVolumeClaim:
          claimName: jellyfin-new-music-pvc
      - name: dev-dri
        hostPath:
          path: /dev/dri
          type: DirectoryOrCreate
---
# 5. Service (MetalLB LoadBalancer)
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
  namespace: jellyfin
  labels:
    app: jellyfin
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.7.208"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Jellyfin"
    gethomepage.dev/description: "Media Server"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "jellyfin.png"
    gethomepage.dev/href: "https://jellyfin.starnix.net"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: jellyfin
  ports:
  - port: 8096
    targetPort: 8096
    protocol: TCP
    name: http

---
# 6. Ingress (Traefik)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin-ingress
  namespace: jellyfin
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-redirect-https@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Jellyfin"
    gethomepage.dev/description: "Media Server"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "jellyfin.png"
    gethomepage.dev/href: "https://jellyfin.starnix.net"
    gethomepage.dev/pod-selector: "app=jellyfin"
spec:
  ingressClassName: traefik
  rules:
  - host: jellyfin.starnix.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jellyfin-service
            port:
              number: 8096
  tls:
  - hosts:
    - jellyfin.starnix.net
    secretName: jellyfin-tls

---
# Vault integration for Jellyfin API key
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: jellyfin

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: default
  namespace: jellyfin
spec:
  method: jwt
  mount: kubernetes
  jwt:
    role: cluster
    serviceAccount: vault-auth
    audiences:
      - vault

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: jellyfin-secrets
  namespace: jellyfin
spec:
  type: kv-v2
  mount: secret
  path: cluster/jellyfin-secrets
  vaultAuthRef: default
  destination:
    name: jellyfin-secrets
    create: true
  refreshAfter: 1h

---
# ConfigMap: prometheus-json-exporter module template.
# ${JELLYFIN_API_KEY} is substituted at pod start by the init container.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jellyfin-json-exporter-config
  namespace: jellyfin
data:
  config.yaml.tmpl: |
    modules:
      jellyfin:
        headers:
          Authorization: "MediaBrowser Token=${JELLYFIN_API_KEY}"
          Content-Type: application/json
          accept: application/json
        metrics:
        - name: jellyfin
          type: object
          help: User playback metrics from Jellyfin
          path: '{ [?(@.NowPlayingItem)] }'
          labels:
            user_name: '{ .UserName }'
            item_type: '{ .NowPlayingItem.Type }'
            item_name: '{ .NowPlayingItem.Name }'
            series_name: '{ .NowPlayingItem.SeriesName }'
            episode_index: 'e{ .NowPlayingItem.IndexNumber }'
            season_index: 's{ .NowPlayingItem.ParentIndexNumber }'
            client_name: '{ .Client }'
            device_name: '{ .DeviceName }'
            session_id: '{ .Id }'
          values:
            is_paused: '{ .PlayState.IsPaused }'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin-json-exporter
  namespace: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin-json-exporter
  template:
    metadata:
      labels:
        app: jellyfin-json-exporter
    spec:
      initContainers:
      - name: config-init
        image: busybox:latest
        command: [sh, -c, 'sed "s|\${JELLYFIN_API_KEY}|$JELLYFIN_API_KEY|g" /tmpl/config.yaml.tmpl > /config/config.yaml']
        env:
        - name: JELLYFIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: jellyfin-secrets
              key: JELLYFIN_API_KEY
        volumeMounts:
        - name: config-tmpl
          mountPath: /tmpl
        - name: config
          mountPath: /config
      containers:
      - name: json-exporter
        image: quay.io/prometheuscommunity/json-exporter:latest
        args: ["--config.file=/config/config.yaml"]
        ports:
        - name: metrics
          containerPort: 7979
        volumeMounts:
        - name: config
          mountPath: /config
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      volumes:
      - name: config-tmpl
        configMap:
          name: jellyfin-json-exporter-config
      - name: config
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-json-exporter
  namespace: jellyfin
  labels:
    app: jellyfin-json-exporter
spec:
  selector:
    app: jellyfin-json-exporter
  ports:
  - name: metrics
    port: 7979
    targetPort: 7979

---
# Native Jellyfin /metrics (enabled via system.xml EnableMetrics=true)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jellyfin-native
  namespace: jellyfin
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: jellyfin
  endpoints:
  - port: http
    path: /metrics
    interval: 30s

---
# Playback session metrics via prometheus-json-exporter + Jellyfin Sessions API
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jellyfin-sessions
  namespace: jellyfin
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: jellyfin-json-exporter
  endpoints:
  - port: metrics
    path: /probe
    interval: 30s
    params:
      module: [jellyfin]
      target: ['http://jellyfin-service.jellyfin.svc.cluster.local:8096/Sessions']
    relabelings:
    - sourceLabels: [__param_target]
      targetLabel: instance
