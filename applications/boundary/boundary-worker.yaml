---
apiVersion: v1
kind: Namespace
metadata:
  name: boundary

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: boundary-worker-config
  namespace: boundary
data:
  worker.hcl: |
    disable_mlock = true

    hcp_boundary_cluster_id = "d4b299c0-61f9-47c6-9547-77ca2ea7e78b"

    listener "tcp" {
      address = "0.0.0.0:9202"
      purpose = "proxy"
    }

    worker {
      auth_storage_path = "/boundary/auth"
tags {
        type = ["k8s"]
      }
    }

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: boundary-worker-auth
  namespace: boundary
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boundary-worker
  namespace: boundary
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: boundary-worker
  template:
    metadata:
      labels:
        app: boundary-worker
    spec:
      containers:
      - name: boundary-worker
        image: hashicorp/boundary:latest
        command: ["boundary", "server", "-config=/config/worker.hcl"]
        volumeMounts:
        - name: config
          mountPath: /config
        - name: auth
          mountPath: /boundary/auth
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          tcpSocket:
            port: 9202
          initialDelaySeconds: 10
          periodSeconds: 30
      volumes:
      - name: config
        configMap:
          name: boundary-worker-config
      - name: auth
        persistentVolumeClaim:
          claimName: boundary-worker-auth
