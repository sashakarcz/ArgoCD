---
# 1. Namespace
# A dedicated namespace for MySpeed resources.
apiVersion: v1
kind: Namespace
metadata:
  name: myspeed
  labels:
    name: myspeed

---
# 2. PersistentVolumeClaim (Longhorn)
# MySpeed keeps its config and the SQLite history DB under /myspeed/data.
# RWO (single writer) because SQLite is not safe for concurrent writers, so
# only one pod ever mounts this volume. Uses the cluster-default Longhorn
# replica count (3).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: myspeed-data-pvc
  namespace: myspeed
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn

---
# 3. Deployment
# Single replica with a Recreate strategy: the SQLite datastore is single-writer,
# and Recreate avoids the RWO Multi-Attach deadlock a RollingUpdate would cause.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myspeed
  namespace: myspeed
  labels:
    app: myspeed
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: myspeed
  template:
    metadata:
      labels:
        app: myspeed
    spec:
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: myspeed
        image: germannewsmaker/myspeed:1.0.9
        ports:
        - containerPort: 5216
          name: http
        env:
        - name: TZ
          value: "America/Chicago"
        readinessProbe:
          httpGet:
            path: /
            port: 5216
          initialDelaySeconds: 10
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /
            port: 5216
          initialDelaySeconds: 30
          periodSeconds: 30
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: data-volume
          mountPath: /myspeed/data
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: myspeed-data-pvc

---
# 4. Service
# Exposes MySpeed internally to the cluster.
apiVersion: v1
kind: Service
metadata:
  name: myspeed-service
  namespace: myspeed
  labels:
    app: myspeed
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "MySpeed"
    gethomepage.dev/description: "Internet Speed Test Tracker"
    gethomepage.dev/group: "Tools"
    gethomepage.dev/icon: "myspeed.png"
    gethomepage.dev/href: "https://myspeed.starnix.net"
spec:
  selector:
    app: myspeed
  ports:
    - protocol: TCP
      port: 5216
      targetPort: 5216
  type: ClusterIP

---
# 5. Ingress with Traefik and Cert-Manager
# External access at myspeed.starnix.net with an automated LE certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myspeed-ingress
  namespace: myspeed
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "MySpeed"
    gethomepage.dev/description: "Internet Speed Test Tracker"
    gethomepage.dev/group: "Tools"
    gethomepage.dev/icon: "myspeed.png"
    gethomepage.dev/href: "https://myspeed.starnix.net"
    gethomepage.dev/pod-selector: "app=myspeed"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - myspeed.starnix.net
    secretName: myspeed-tls-cert
  rules:
  - host: myspeed.starnix.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: myspeed-service
            port:
              number: 5216
