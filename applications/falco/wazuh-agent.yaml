---
# Custom ossec.conf for the Falco-shipping agents. The wazuh/wazuh-agent image's
# documented pattern is to mount a full ossec.conf at $WAZUH_CONFIG_MOUNT/etc/
# (its env-var templating only fills CHANGE* placeholders and has no group
# handling). This config connects to the manager, enrolls into the "falco" group
# (so the manager pushes the shared <localfile> for /var/log/falco/events.json --
# see applications/wazuh/shared/falco/agent.conf), and keeps the CHANGEE_AGENT_NAME
# placeholder so the image seds in the per-node name from WAZUH_AGENT_NAME.
# No syscheck/rootcheck/syscollector here: these agents only ship Falco events.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-agent-falco-conf
  namespace: falco
data:
  ossec.conf: |
    <ossec_config>
      <client>
        <server>
          <address>192.168.7.220</address>
          <port>1514</port>
          <protocol>tcp</protocol>
        </server>
        <enrollment>
          <enabled>yes</enabled>
          <manager_address>192.168.7.220</manager_address>
          <port>1515</port>
          <agent_name>CHANGEE_AGENT_NAME</agent_name>
          <groups>falco</groups>
        </enrollment>
        <crypto_method>aes</crypto_method>
        <notify_time>10</notify_time>
        <time-reconnect>60</time-reconnect>
        <auto_restart>yes</auto_restart>
      </client>

      <client_buffer>
        <disabled>no</disabled>
        <queue_size>5000</queue_size>
        <events_per_second>500</events_per_second>
      </client_buffer>

      <logging>
        <log_format>plain</log_format>
      </logging>
    </ossec_config>
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wazuh-agent-falco
  namespace: falco
  labels:
    app: wazuh-agent-falco
spec:
  selector:
    matchLabels:
      app: wazuh-agent-falco
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: wazuh-agent-falco
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      terminationGracePeriodSeconds: 30
      containers:
      - name: wazuh-agent
        # Must match the manager version (wazuh-manager is v4.14.1).
        image: wazuh/wazuh-agent:4.14.1
        imagePullPolicy: IfNotPresent
        env:
        # k8s expands $(NODE_NAME) in a later env var referencing an earlier one,
        # giving each agent a stable, unique per-node name. The image seds this
        # into the CHANGEE_AGENT_NAME placeholder in the mounted ossec.conf.
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: WAZUH_AGENT_NAME
          value: "falco-$(NODE_NAME)"
        # Tell the image to copy our custom ossec.conf into place on start.
        - name: WAZUH_CONFIG_MOUNT
          value: "/wazuh-config-mount"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 384Mi
        volumeMounts:
        - name: config
          mountPath: /wazuh-config-mount/etc/ossec.conf
          subPath: ossec.conf
          readOnly: true
        # Falco's per-node event stream, written by the Falco DaemonSet.
        - name: falco-events
          mountPath: /var/log/falco
          readOnly: true
        livenessProbe:
          exec:
            command: ["/var/ossec/bin/wazuh-control", "status"]
          initialDelaySeconds: 60
          periodSeconds: 60
          timeoutSeconds: 15
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: wazuh-agent-falco-conf
      - name: falco-events
        hostPath:
          path: /var/log/falco
          type: DirectoryOrCreate
