---
apiVersion: v1
kind: Namespace
metadata:
  name: stirling-pdf

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stirling-pdf-data
  namespace: stirling-pdf
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
  labels:
    app: stirling-pdf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stirling-pdf
  template:
    metadata:
      labels:
        app: stirling-pdf
    spec:
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: stirling-pdf
        image: stirlingtools/stirling-pdf:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: DOCKER_ENABLE_SECURITY
          value: "false"
        - name: INSTALL_BOOK_AND_ADVANCED_HTML_OPS
          value: "false"
        - name: LANGS
          value: "en_GB"
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /api/v1/info/status
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/v1/info/status
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - name: stirling-pdf-data
          mountPath: /usr/share/tessdata
          subPath: tessdata
        - name: stirling-pdf-data
          mountPath: /configs
          subPath: configs
        - name: stirling-pdf-data
          mountPath: /customFiles
          subPath: customFiles
      volumes:
      - name: stirling-pdf-data
        persistentVolumeClaim:
          claimName: stirling-pdf-data

---
apiVersion: v1
kind: Service
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
  labels:
    app: stirling-pdf
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Starnix PDF Tools"
    gethomepage.dev/description: "PDF Tools"
    gethomepage.dev/group: "Tools"
    gethomepage.dev/icon: "stirling-pdf.png"
    gethomepage.dev/href: "https://pdf.starnix.net"
spec:
  type: ClusterIP
  selector:
    app: stirling-pdf
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stirling-pdf-ingress
  namespace: stirling-pdf
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Starnix PDF Tools"
    gethomepage.dev/description: "PDF Tools"
    gethomepage.dev/group: "Tools"
    gethomepage.dev/icon: "stirling-pdf.png"
    gethomepage.dev/href: "https://pdf.starnix.net"
    gethomepage.dev/pod-selector: "app=stirling-pdf"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - pdf.starnix.net
    secretName: stirling-pdf-tls
  rules:
  - host: pdf.starnix.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: stirling-pdf
            port:
              number: 8080
