---
apiVersion: v1
kind: Namespace
metadata:
  name: eve-notifier
---
# eve-notifier-secrets: synced from OpenBao secret/cluster/eve-notifier-secrets via ESO (ClusterSecretStore 'openbao').
# Migrated from a VSO VaultStaticSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eve-notifier-secrets
  namespace: eve-notifier
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: eve-notifier-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster/eve-notifier-secrets
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eve-notifier-state
  namespace: eve-notifier
  labels:
    recurring-job-group.longhorn.io/default: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eve-notifier
  namespace: eve-notifier
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: eve-notifier
  template:
    metadata:
      labels:
        app: eve-notifier
    spec:
      enableServiceLinks: false
      initContainers:
      - name: validate-state
        image: alpine:latest
        command:
        - sh
        - -c
        - |
          if [ -f /app/state/state.json ]; then
            apk add --no-cache python3 -q 2>/dev/null
            python3 -c "import json; json.load(open('/app/state/state.json'))" 2>/dev/null || {
              echo "state.json corrupted, removing..."
              rm -f /app/state/state.json
            }
          fi
        volumeMounts:
        - name: state
          mountPath: /app/state
      - name: git-sync-init
        image: registry.k8s.io/git-sync/git-sync:v4.4.0
        args:
        - --repo=https://github.com/ComaDoofWarrior/zKillBot.git
        - --ref=main
        - --root=/git
        - --link=current
        - --one-time
        env:
        - name: GITSYNC_USERNAME
          value: usenix17
        - name: GITSYNC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: eve-notifier-secrets
              key: git-pat
        volumeMounts:
        - name: config
          mountPath: /git
      # Seed the live (blue) slot from the first pull so eve-notifier always boots
      # with a config. Steady-state promotion to /live is gated by config-gate.
      - name: seed-config
        image: alpine:latest
        command:
        - sh
        - -c
        - |
          if [ -f /git/current/config.yaml ]; then
            cp /git/current/config.yaml /live/config.yaml
            echo "seeded /live/config.yaml from git HEAD"
          else
            echo "WARNING: /git/current/config.yaml missing at seed time"
          fi
        volumeMounts:
        - name: config
          mountPath: /git
        - name: live
          mountPath: /live
      containers:
      - name: git-sync
        image: registry.k8s.io/git-sync/git-sync:v4.4.0
        args:
        - --repo=https://github.com/ComaDoofWarrior/zKillBot.git
        - --ref=main
        - --root=/git
        - --link=current
        - --period=60s
        env:
        - name: GITSYNC_USERNAME
          value: usenix17
        - name: GITSYNC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: eve-notifier-secrets
              key: git-pat
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: config
          mountPath: /git
      # config-gate: blue/green validation gate for the git-synced config.
      # Runs from the eve-notifier image so it can boot the REAL parser as the
      # authoritative schema check. On each candidate change:
      #   1. yamllint (syntax, relaxed)
      #   2. boot /app/eve-notifier against the candidate with webhook tokens
      #      neutered + a throwaway state dir, killed after 8s (survives = OK)
      #   3. pass -> promote candidate to /live (eve-notifier watches /live and
      #      hot-reloads it) + Discord OK
      #      fail -> keep last-good /live untouched + Discord alert (why)
      # Alerts always use the last-good /live webhook, so a broken candidate that
      # lacks/breaks its own webhook still reaches Discord.
      - name: config-gate
        image: registry.starnix.net/library/eve-notifier:latest
        env:
        - name: TZ
          value: US/Central
        command:
        - /bin/sh
        - -c
        - |
          set -u
          until apk add --no-cache yamllint jq curl coreutils >/dev/null 2>&1; do
            echo "waiting for apk (yamllint/jq/curl/coreutils)..."; sleep 5
          done

          BIN=/app/eve-notifier
          CAND=/config/current/config.yaml
          LIVE=/live/config.yaml
          # Relaxed yamllint: only genuine syntax breakage / duplicate keys are
          # errors. The authoritative schema check is the real parser below.
          YLCONF='{extends: relaxed, rules: {line-length: disable, comments: disable, comments-indentation: disable, trailing-spaces: disable, empty-lines: disable, document-start: disable, truthy: disable, indentation: disable, brackets: disable, colons: disable, commas: disable, new-line-at-end-of-file: disable, new-lines: disable}}'

          notify() {
            WH=$(grep -m1 '^alert_webhook_url:' "$LIVE" 2>/dev/null | sed 's/^alert_webhook_url:[[:space:]]*//' | tr -d "\"' " | tr -d '\r')
            case "$WH" in
              https://discord.com/*) ;;
              *) echo "no valid live webhook; skipping discord notify"; return ;;
            esac
            BODY=$(jq -n --arg c "$1" '{content: $c}')
            curl -s -X POST "$WH" -H 'Content-Type: application/json' -d "$BODY" >/dev/null 2>&1 || true
          }

          REASON=""
          validate() {
            REASON=""
            # 1) syntax
            YL=$(yamllint --no-warnings -d "$YLCONF" "$CAND" 2>&1)
            if [ $? -ne 0 ]; then
              REASON="yamllint (syntax):
          $YL"
              return 1
            fi
            # 2) real parser, side-effect-free: neuter webhook tokens (keep the
            #    discord.com host so any host validation still passes), throwaway
            #    state dir, kill after 8s. Surviving to the timeout (rc 124) means
            #    config + rules loaded clean.
            TMPD=$(mktemp -d)
            sed -E 's#(https://discord\.com/api/webhooks/)[^"'"'"' ]+#\10/blackhole#g' "$CAND" > "$TMPD/config.yaml"
            ( cd "$TMPD" && timeout 8 "$BIN" -config "$TMPD/config.yaml" >"$TMPD/out.log" 2>&1 )
            RC=$?
            if [ "$RC" != "124" ] && [ "$RC" != "0" ]; then
              REASON="parser (rc=$RC):
          $(tail -n 15 "$TMPD/out.log")"
              rm -rf "$TMPD"
              return 1
            fi
            rm -rf "$TMPD"
            return 0
          }

          LAST=$(readlink /config/current 2>/dev/null)
          echo "config-gate started (LAST=$LAST)"
          while true; do
            CUR=$(readlink /config/current 2>/dev/null)
            if [ -n "$CUR" ] && [ "$CUR" != "$LAST" ]; then
              echo "candidate changed -> $CUR ; validating"
              if validate; then
                # eve-notifier watches /live and hot-reloads on write, so the cp
                # alone rolls the new config out -- no restart/signal needed.
                cp "$CAND" "$LIVE"
                notify "$(printf '✅ **eve-notifier config promoted**\nValidated (yamllint + parser) and hot-reloaded `%s`.' "$CUR")"
                echo "PROMOTED $CUR"
              else
                notify "$(printf '❌ **eve-notifier config REJECTED** (`%s`)\nKept the previous good config.\n```\n%s\n```' "$CUR" "$(printf '%s' "$REASON" | head -c 1500)")"
                echo "REJECTED $CUR: $REASON"
              fi
              LAST="$CUR"
            fi
            sleep 5
          done
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 192Mi
        volumeMounts:
        - name: config
          mountPath: /config
        - name: live
          mountPath: /live
      - name: eve-notifier
        image: registry.starnix.net/library/eve-notifier:latest
        env:
        - name: TZ
          value: US/Central
        args:
        - --config
        - /live/config.yaml
        workingDir: /app/state
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: live
          mountPath: /live
        - name: state
          mountPath: /app/state
      volumes:
      - name: config
        emptyDir: {}
      - name: live
        emptyDir: {}
      - name: state
        persistentVolumeClaim:
          claimName: eve-notifier-state
