---
apiVersion: v1
kind: Namespace
metadata:
  name: eve-notifier

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: eve-notifier

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: default
  namespace: eve-notifier
spec:
  method: jwt
  mount: kubernetes
  jwt:
    role: cluster
    serviceAccount: vault-auth
    audiences:
      - vault

---
# Vault secret must contain:
#   git-pat  - Personal access token for pulling the private config repo
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: eve-notifier-secrets
  namespace: eve-notifier
spec:
  type: kv-v2
  mount: secret
  path: cluster/eve-notifier-secrets
  vaultAuthRef: default
  destination:
    name: eve-notifier-secrets
    create: true
  refreshAfter: 1h

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eve-notifier-state
  namespace: eve-notifier
  labels:
    recurring-job-group.longhorn.io/default: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eve-notifier
  namespace: eve-notifier
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: eve-notifier
  template:
    metadata:
      labels:
        app: eve-notifier
    spec:
      enableServiceLinks: false
      initContainers:
      - name: validate-state
        image: alpine:latest
        command:
        - sh
        - -c
        - |
          if [ -f /app/state/state.json ]; then
            apk add --no-cache python3 -q 2>/dev/null
            python3 -c "import json; json.load(open('/app/state/state.json'))" 2>/dev/null || {
              echo "state.json corrupted, removing..."
              rm -f /app/state/state.json
            }
          fi
        volumeMounts:
        - name: state
          mountPath: /app/state
      - name: git-sync-init
        image: registry.k8s.io/git-sync/git-sync:v4.4.0
        args:
        - --repo=https://github.com/ComaDoofWarrior/zKillBot.git
        - --ref=main
        - --root=/git
        - --link=current
        - --one-time
        env:
        - name: GITSYNC_USERNAME
          value: usenix17
        - name: GITSYNC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: eve-notifier-secrets
              key: git-pat
        volumeMounts:
        - name: config
          mountPath: /git
      containers:
      - name: git-sync
        image: registry.k8s.io/git-sync/git-sync:v4.4.0
        args:
        - --repo=https://github.com/ComaDoofWarrior/zKillBot.git
        - --ref=main
        - --root=/git
        - --link=current
        - --period=60s
        env:
        - name: GITSYNC_USERNAME
          value: usenix17
        - name: GITSYNC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: eve-notifier-secrets
              key: git-pat
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: config
          mountPath: /git
      - name: config-notifier
        image: alpine:latest
        env:
        - name: TZ
          value: US/Central
        command:
        - /bin/sh
        - -c
        - |
          until apk add --no-cache curl jq; do sleep 5; done
          LAST=""
          while true; do
            CURRENT=$(readlink /config/current 2>/dev/null)
            if [ -n "$CURRENT" ] && [ "$CURRENT" != "$LAST" ]; then
              if [ -n "$LAST" ]; then
                echo "Config changed, sending notification..."
                WEBHOOK=$(grep -m1 '^alert_webhook_url:' /config/current/config.yaml | sed 's/^alert_webhook_url:[[:space:]]*//' | tr -d '"'"'"'' | tr -d '\r')
                if [ -n "$WEBHOOK" ]; then
                  CONFIG=$(cat /config/current/config.yaml 2>/dev/null)
                  # Truncate to 1800 chars to stay within Discord limits
                  if [ ${#CONFIG} -gt 1800 ]; then
                    CONFIG=$(printf '%s\n(truncated)' "$(printf '%s' "$CONFIG" | head -c 1800)")
                  fi
                  BODY=$(jq -n --arg msg "$(printf '⚙️ **eve-notifier config reloaded**\n```yaml\n%s\n```' "$CONFIG")" '{"content": $msg}')
                  curl -s -X POST "$WEBHOOK" \
                    -H "Content-Type: application/json" \
                    -d "$BODY" || true
                else
                  echo "alert_webhook_url not set in config, skipping notification"
                fi
              fi
              LAST="$CURRENT"
            fi
            sleep 5
          done
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - name: config
          mountPath: /config
      - name: eve-notifier
        image: registry.starnix.net/library/eve-notifier:latest
        env:
        - name: TZ
          value: US/Central
        args:
        - --config
        - /config/current/config.yaml
        workingDir: /app/state
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /config
        - name: state
          mountPath: /app/state
      volumes:
      - name: config
        emptyDir: {}
      - name: state
        persistentVolumeClaim:
          claimName: eve-notifier-state
