---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: repeater-scraper
  namespace: repeater-scraper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: repeater-scraper
  template:
    metadata:
      labels:
        app: repeater-scraper
    spec:
      containers:
      - name: repeater-scraper
        image: registry.starnix.net/library/repeater-scraper:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /repeaters?lat=47.6062&lon=-122.3321
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: repeater-scraper
  namespace: repeater-scraper
spec:
  selector:
    app: repeater-scraper
  ports:
  - port: 80
    targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: repeater-scraper
  namespace: repeater-scraper
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Repeater Scraper"
    gethomepage.dev/description: "Radio Repeater Data"
    gethomepage.dev/group: "Tools"
    gethomepage.dev/icon: "mdi-radio-tower"
    gethomepage.dev/href: "https://repeater.starnix.net"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - repeater.starnix.net
    secretName: repeater-scraper-tls
  rules:
  - host: repeater.starnix.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: repeater-scraper
            port:
              number: 80
