---
apiVersion: v1
kind: Namespace
metadata:
  name: ghost

---
# NFS PV for Ghost content (themes, images, uploads)
# Before syncing, create on mimir: mkdir -p /mnt/Store/ghost
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ghost-content-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  mountOptions:
    - noatime
    - rsize=1048576
    - wsize=1048576
    - hard
    - nfsvers=4.1
  claimRef:
    name: ghost-content-pvc
    namespace: ghost
  nfs:
    server: 192.168.1.75
    path: /mnt/Store/ghost

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ghost-content-pvc
  namespace: ghost
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: manual

---
# MySQL using official Docker Hub image (avoids Bitnami registry issues)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ghost-mysql-pvc
  namespace: ghost
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 8Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost-mysql
  namespace: ghost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ghost-mysql
  template:
    metadata:
      labels:
        app: ghost-mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_DATABASE
          value: ghost
        - name: MYSQL_USER
          value: ghost
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ghost-secrets
              key: mysql-password
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ghost-secrets
              key: mysql-root-password
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          exec:
            command: ["mysqladmin", "ping", "-h", "localhost"]
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ghost-mysql-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: ghost-mysql
  namespace: ghost
spec:
  selector:
    app: ghost-mysql
  ports:
  - port: 3306
    targetPort: 3306

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ghost
  namespace: ghost
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: ghost.starnix.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ghost
                port:
                  number: 80
  tls:
    - secretName: ghost-tls
      hosts:
        - ghost.starnix.net

---
# Vault Integration
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: ghost

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: default
  namespace: ghost
spec:
  method: jwt
  mount: kubernetes
  jwt:
    role: cluster
    serviceAccount: vault-auth
    audiences:
      - vault

---
# vault kv put secret/cluster/ghost-secrets \
#   ghost-password='...' \
#   mysql-password='...' \
#   mysql-root-password='...'
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ghost-secrets
  namespace: ghost
spec:
  type: kv-v2
  mount: secret
  path: cluster/ghost-secrets
  vaultAuthRef: default
  destination:
    name: ghost-secrets
    create: true
  refreshAfter: 1h
