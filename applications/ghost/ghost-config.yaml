---
apiVersion: v1
kind: Namespace
metadata:
  name: ghost

---
# Vault Integration
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: ghost

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: default
  namespace: ghost
spec:
  method: jwt
  mount: kubernetes
  jwt:
    role: cluster
    serviceAccount: vault-auth
    audiences:
      - vault

---
# vault kv put secret/cluster/ghost-secrets \
#   ghost-password='...' \
#   mysql-password='...' \
#   mysql-root-password='...'
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ghost-secrets
  namespace: ghost
spec:
  type: kv-v2
  mount: secret
  path: cluster/ghost-secrets
  vaultAuthRef: default
  destination:
    name: ghost-secrets
    create: true
  refreshAfter: 1h

---
# NFS PV for Ghost content (themes, images, uploads)
# Before syncing, create on NAS: mkdir -p /mnt/Store/ghost
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ghost-content-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  mountOptions:
    - noatime
    - rsize=1048576
    - wsize=1048576
    - hard
    - nfsvers=4.1
  claimRef:
    name: ghost-content-pvc
    namespace: ghost
  nfs:
    server: 192.168.1.75
    path: /mnt/Store/ghost

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ghost-content-pvc
  namespace: ghost
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: manual

---
# MySQL using official Docker Hub image
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ghost-mysql-pvc
  namespace: ghost
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 8Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost-mysql
  namespace: ghost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ghost-mysql
  template:
    metadata:
      labels:
        app: ghost-mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_DATABASE
          value: ghost
        - name: MYSQL_USER
          value: ghost
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ghost-secrets
              key: mysql-password
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ghost-secrets
              key: mysql-root-password
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          exec:
            command: ["mysqladmin", "ping", "-h", "localhost"]
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ghost-mysql-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: ghost-mysql
  namespace: ghost
spec:
  selector:
    app: ghost-mysql
  ports:
  - port: 3306
    targetPort: 3306

---
# Ghost using official Docker Hub image (ghost:5)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost
  namespace: ghost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ghost
  template:
    metadata:
      labels:
        app: ghost
    spec:
      initContainers:
      - name: wait-for-mysql
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z ghost-mysql 3306; do echo waiting for mysql; sleep 2; done']
      containers:
      - name: ghost
        image: ghost:5
        env:
        - name: url
          value: https://sanitydeclines.com
        - name: admin__url
          value: https://sanitydeclines.com
        - name: database__client
          value: mysql
        - name: database__connection__host
          value: ghost-mysql
        - name: database__connection__port
          value: "3306"
        - name: database__connection__database
          value: ghost
        - name: database__connection__user
          value: ghost
        - name: database__connection__password
          valueFrom:
            secretKeyRef:
              name: ghost-secrets
              key: mysql-password
        - name: server__trustedProxies__0
          value: "10.0.0.0/8"
        - name: mail__transport
          value: SMTP
        - name: mail__from
          value: '"Sanity Declines" <info@starnix.net>'
        - name: mail__options__host
          value: smtp.gmail.com
        - name: mail__options__port
          value: "587"
        - name: mail__options__auth__user
          value: info@starnix.net
        - name: mail__options__auth__pass
          valueFrom:
            secretKeyRef:
              name: ghost-secrets
              key: smtp-password
        - name: NODE_ENV
          value: production
        ports:
        - containerPort: 2368
        volumeMounts:
        - name: content
          mountPath: /var/lib/ghost/content
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /ghost/api/admin/site/
            port: 2368
            httpHeaders:
              - name: Host
                value: sanitydeclines.com
              - name: X-Forwarded-Proto
                value: https
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: content
        persistentVolumeClaim:
          claimName: ghost-content-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: ghost
  namespace: ghost
spec:
  selector:
    app: ghost
  ports:
  - port: 80
    targetPort: 2368

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ghost
  namespace: ghost
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Ghost"
    gethomepage.dev/description: "Blog"
    gethomepage.dev/group: "Apps"
    gethomepage.dev/icon: "ghost.png"
    gethomepage.dev/href: "https://ghost.starnix.net"
spec:
  ingressClassName: traefik
  rules:
    - host: ghost.starnix.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ghost
                port:
                  number: 80
  tls:
    - secretName: ghost-tls
      hosts:
        - ghost.starnix.net
